  function renderReportPreview(rep) {
    var meta = rep.metadata || {};
    document.getElementById('repMetaInstansi').textContent = meta.instansi || APP_STATE.settings.NAMA_INSTANSI;
    document.getElementById('repMetaAlamat').textContent = (meta.alamat || APP_STATE.settings.ALAMAT_INSTANSI) + ' | Telp: ' + (meta.telepon || APP_STATE.settings.TELEPON_INSTANSI);
    document.getElementById('repMetaTitle').textContent = rep.reportTitle;
    document.getElementById('repMetaPeriode').textContent = meta.periode || 'Semua Periode';
    document.getElementById('repMetaTglCetak').textContent = meta.tanggalCetak || '-';
    document.getElementById('repSignPetugas').textContent = meta.koordinatorGudang || 'Koordinator Gudang PB';
    document.getElementById('repSignPimpinan').textContent = meta.kepalaMarkas || 'Kepala Markas PMI Kota Surakarta';

    // Summary pills
    var sumKeys = Object.keys(rep.summary || {});
    var sumHtml = '';
    for (var s = 0; s < sumKeys.length; s++) {
      var k = sumKeys[s];
      sumHtml +=
        '<div class="px-3 py-2 rounded-3 bg-light border">' +
          '<div class="small text-muted">' + escapeHtml(k) + '</div>' +
          '<div class="fw-bolder text-dark">' + escapeHtml(rep.summary[k]) + '</div>' +
        '</div>';
    }
    document.getElementById('reportSummaryPills').innerHTML = sumHtml;

    // Header Tabel
    var cols = rep.columns || [];
    var thHtml = '<tr>';
    for (var c = 0; c < cols.length; c++) {
      thHtml += '<th>' + escapeHtml(cols[c]) + '</th>';
    }
    thHtml += '</tr>';
    document.getElementById('reportTableHead').innerHTML = thHtml;

    // Body Tabel
    var rows = rep.rows || [];
    var tbHtml = '';
    if (rows.length === 0) {
      tbHtml = '<tr><td colspan="' + cols.length + '" class="text-center text-muted py-4">Tidak ada data pada kriteria laporan ini.</td></tr>';
    } else {
      for (var r = 0; r < rows.length; r++) {
        tbHtml += '<tr>';
        for (var cellIdx = 0; cellIdx < rows[r].length; cellIdx++) {
          var val = rows[r][cellIdx];
          var colName = String(cols[cellIdx] || '');
          if (typeof val === 'number' && colName.indexOf('(Rp)') !== -1) {
            tbHtml += '<td class="text-end fw-bold">' + formatRupiah(val) + '</td>';
          } else if (typeof val === 'number' && cellIdx > 0) {
            tbHtml += '<td class="text-end">' + formatNumber(val) + '</td>';
          } else {
            tbHtml += '<td>' + escapeHtml(val) + '</td>';
          }
        }
        tbHtml += '</tr>';
      }
    }
    document.getElementById('reportTableBody').innerHTML = tbHtml;
  }

  /* ==========================================================================
   * 13. MIGRASI & IMPORT DATA EXCEL (Stock Report Gudang PB.xlsx - BAB 16)
   * ========================================================================== */
  function handleExcelFileSelected(e) {
    var file = e.target.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function(evt) {
      try {
        var data = new Uint8Array(evt.target.result);
        var wb = XLSX.read(data, { type: 'array', cellDates: true });
        APP_STATE.excelWorkbook = wb;

        var sheetListEl = document.getElementById('excelSheetListGroup');
        var html = '';
        for (var i = 0; i < wb.SheetNames.length; i++) {
          var sName = wb.SheetNames[i];
          var guessedCat = guessCategoryFromSheetName(sName);
          html +=
            '<div class="list-group-item d-flex align-items-center justify-content-between gap-2">' +
              '<div class="form-check">' +
                '<input class="form-check-input excel-sheet-checkbox" type="checkbox" value="' + escapeHtml(sName) + '" id="chkSheet_' + i + '" checked>' +
                '<label class="form-check-label fw-bold" for="chkSheet_' + i + '">' + escapeHtml(sName) + '</label>' +
              '</div>' +
              '<select class="form-select form-select-sm excel-sheet-category" data-sheet="' + escapeHtml(sName) + '" style="width: 155px;">' +
                '<option value="FOOD ITEMS"' + (guessedCat === 'FOOD ITEMS' ? ' selected' : '') + '>FOOD ITEMS</option>' +
                '<option value="NON FOOD"' + (guessedCat === 'NON FOOD' ? ' selected' : '') + '>NON FOOD</option>' +
                '<option value="OBAT"' + (guessedCat === 'OBAT' ? ' selected' : '') + '>OBAT</option>' +
              '</select>' +
            '</div>';
        }
        sheetListEl.innerHTML = html;
        document.getElementById('excelSheetsCheckContainer').classList.remove('d-none');
        document.getElementById('btnParsePreviewExcel').disabled = false;
        parseAndPreviewExcelFile();
      } catch (err) {
        showToast('Gagal membaca file Excel: ' + err.message, 'danger');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function guessCategoryFromSheetName(name) {
    var u = String(name || '').toUpperCase();
    if (u.indexOf('NON') !== -1 || u.indexOf('NFI') !== -1) return 'NON FOOD';
    if (u.indexOf('OBAT') !== -1 || u.indexOf('MED') !== -1 || u.indexOf('FARMASI') !== -1) return 'OBAT';
    return 'FOOD ITEMS';
  }

  /**
   * Mem-parsing baris dari setiap sheet yang dipilih dengan pemetaan kolom adaptif
   * untuk mendukung format header 2-baris maupun 1-baris pada Stock Report Gudang PB.xlsx
   * (Food Items, Non Food, dan Obat), membedakan baris Master Barang, Transaksi Masuk/Keluar,
   * catatan komponen Expired Date, dan melewati baris Total/Footer tanda tangan.
   */
  function parseAndPreviewExcelFile() {
    var wb = APP_STATE.excelWorkbook;
    if (!wb) return;

    var checkboxes = document.querySelectorAll('.excel-sheet-checkbox:checked');
    var parsedRows = [];

    for (var s = 0; s < checkboxes.length; s++) {
      var sheetName = checkboxes[s].value;
      var catSelect = document.querySelector('.excel-sheet-category[data-sheet="' + sheetName.replace(/"/g, '\\"') + '"]');
      var sheetCategory = catSelect ? catSelect.value : guessCategoryFromSheetName(sheetName);
      var worksheet = wb.Sheets[sheetName];
      if (!worksheet) continue;

      var rawMatrix = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
      if (rawMatrix.length === 0) continue;

      // Cari baris header utama dalam 18 baris pertama
      var headerRowIdx = 0;
      var bestScore = -1;
      for (var r = 0; r < Math.min(18, rawMatrix.length); r++) {
        var rowStr = rawMatrix[r].join(' ').toUpperCase();
        var score = 0;
        if (rowStr.indexOf('NAMA BARANG') !== -1 || rowStr.indexOf('JENIS BARANG') !== -1 || rowStr.indexOf('DESCRIPTION') !== -1) score += 4;
        if (rowStr.indexOf('STOCK BALANCE') !== -1 || rowStr.indexOf('DOCUMEN') !== -1 || rowStr.indexOf('INFORMASI BARANG') !== -1) score += 3;
        if (rowStr.indexOf('SATUAN') !== -1 || rowStr.indexOf('UNIT') !== -1) score += 2;
        if (rowStr.indexOf('MASUK') !== -1 || rowStr.indexOf('KELUAR') !== -1 || rowStr.indexOf('BALANCE') !== -1 || rowStr.indexOf('EXPIRED') !== -1 || rowStr.indexOf('EX-DATE') !== -1) score += 2;
        if (score > bestScore) {
          bestScore = score;
          headerRowIdx = r;
        }
      }

      // Gabungkan headerRowIdx dengan baris sub-header di bawahnya jika menggunakan format header 2 baris (seperti Stock Report Gudang PB.xlsx)
      var topHeaders = rawMatrix[headerRowIdx].map(function(h) { return String(h || '').trim().toUpperCase(); });
      var dataStartIdx = headerRowIdx + 1;
      var combinedHeaders = topHeaders.slice();

      if (headerRowIdx + 1 < rawMatrix.length) {
        var nextRow = rawMatrix[headerRowIdx + 1].map(function(h) { return String(h || '').trim().toUpperCase(); });
        var nextRowStr = nextRow.join(' ');
        if (
          nextRowStr.indexOf('CODE') !== -1 ||
          nextRowStr.indexOf('HARGA') !== -1 ||
          nextRowStr.indexOf('DONOR') !== -1 ||
          nextRowStr.indexOf('AWAL') !== -1 ||
          nextRowStr.indexOf('MASUK') !== -1 ||
          nextRowStr.indexOf('KELUAR') !== -1 ||
          nextRowStr.indexOf('GDN') !== -1 ||
          nextRowStr.indexOf('GRN') !== -1
        ) {
          var maxCols = Math.max(topHeaders.length, nextRow.length);
          for (var cIdx = 0; cIdx < maxCols; cIdx++) {
            var topH = topHeaders[cIdx] || '';
            var subH = nextRow[cIdx] || '';
            combinedHeaders[cIdx] = (topH && subH) ? (topH + ' ' + subH) : (subH || topH);
          }
          dataStartIdx = headerRowIdx + 2;
        }
      }

      // Lewati baris nomor indeks kolom (misal: 1, 2, 3, 5, 6, , 7, 8, 13, 12...) jika ada
      if (dataStartIdx < rawMatrix.length) {
        var possibleNumRow = rawMatrix[dataStartIdx];
        var numCount = 0;
        var nonEmptyCount = 0;
        for (var nIdx = 0; nIdx < possibleNumRow.length; nIdx++) {
          var cellVal = String(possibleNumRow[nIdx] || '').trim();
          if (cellVal !== '') {
            nonEmptyCount++;
            if (/^\d+$/.test(cellVal) && parseInt(cellVal, 10) <= 30) numCount++;
          }
        }
        if (nonEmptyCount >= 5 && numCount === nonEmptyCount) {
          dataStartIdx++;
        }
      }

      var colMap = detectSheetColumnMapping(combinedHeaders, topHeaders);
      var seenMasterKeysInSheet = {};
      var activeMasterCtx = null;
      var blockRunningIn = 0;
      var blockRunningOut = 0;

      for (var rowIdx = dataStartIdx; rowIdx < rawMatrix.length; rowIdx++) {
        var cells = rawMatrix[rowIdx];
        if (!cells || cells.length === 0) continue;

        var col0Str = String(cells[0] || '').trim();
        var col1Str = String(cells[1] || '').trim();
        var fullRowUpper = cells.join(' ').toUpperCase();

        // Lewati baris footer, total blok, atau blok tanda tangan lembar kerja
        if (
          col0Str.toUpperCase().indexOf('TOTAL') === 0 ||
          col1Str.toUpperCase().indexOf('TOTAL') === 0 ||
          fullRowUpper.indexOf('LEMBAR KERJA') !== -1 ||
          fullRowUpper.indexOf('TANGGAL BERLAKU') !== -1 ||
          fullRowUpper.indexOf('KESIAPSIAGAAN DAN RESPON') !== -1 ||
          fullRowUpper.indexOf('KABAG PB') !== -1 ||
          fullRowUpper.indexOf('MENGETAHUI,') !== -1 ||
          fullRowUpper.indexOf('DIBUAT OLEH') !== -1 ||
          fullRowUpper.indexOf('WANTO, S.KM') !== -1 ||
          fullRowUpper.indexOf('INDRO SRI WIDODO') !== -1 ||
          fullRowUpper.indexOf('PALANG MERAH INDONESIA') !== -1 ||
          fullRowUpper.indexOf('NAMA GUDANG') !== -1 ||
          fullRowUpper.indexOf('LOKASI GUDANG') !== -1
        ) {
          continue;
        }

        var rawNo = colMap.no !== -1 ? String(cells[colMap.no] || '').trim() : '';
        var rawKode = colMap.kode !== -1 ? String(cells[colMap.kode] || '').trim() : '';
        var rawNama = colMap.nama !== -1 ? String(cells[colMap.nama] || '').trim() : '';
        var rawSatuan = colMap.satuan !== -1 ? String(cells[colMap.satuan] || '').trim() : '';
        var rawHarga = colMap.harga !== -1 ? parseNumericCell(cells[colMap.harga]) : 0;
        var rawDonor = colMap.donor !== -1 ? String(cells[colMap.donor] || '').trim() : '';
        var rawReq = colMap.request !== -1 ? String(cells[colMap.request] || '').trim() : '';
        var rawGdn = colMap.gdn !== -1 ? String(cells[colMap.gdn] || '').trim() : '';
        var rawGrn = colMap.grn !== -1 ? String(cells[colMap.grn] || '').trim() : '';
        var rawTanggal = colMap.tanggal !== -1 ? formatClientDateISO(cells[colMap.tanggal]) : '';
        var rawExp = colMap.expired !== -1 ? formatClientDateISO(cells[colMap.expired]) : '';
        var rawKet = colMap.ket !== -1 ? String(cells[colMap.ket] || '').trim() : '';

        var rawAwal = 0;
        var rawMasuk = 0;
        var rawKeluar = 0;
        var rawSaldo = colMap.saldo !== -1 ? parseNumericCell(cells[colMap.saldo]) : 0;
        var rawTujuan = '';

        // Format C (Sheet 3 Stock Report Gudang PB.xlsx: IN/Dari, OUT/Kepada, TOTAL/Jumlah)
        if (colMap.isFormatInOutTotal) {
          var dariVal = colMap.inDari !== -1 ? String(cells[colMap.inDari] || '').trim() : '';
          var kepadaVal = colMap.outKepada !== -1 ? String(cells[colMap.outKepada] || '').trim() : '';
          var totalQtyVal = colMap.totalQty !== -1 ? parseNumericCell(cells[colMap.totalQty]) : 0;
          if (kepadaVal && totalQtyVal > 0) {
            rawKeluar = totalQtyVal;
            rawTujuan = kepadaVal;
          } else if (totalQtyVal > 0) {
            rawMasuk = totalQtyVal;
            if (dariVal && (!rawDonor || rawDonor === '-')) rawDonor = dariVal;
          }
        } else {
          rawAwal = colMap.awal !== -1 ? parseNumericCell(cells[colMap.awal]) : 0;
          rawMasuk = colMap.masuk !== -1 ? parseNumericCell(cells[colMap.masuk]) : 0;
          rawKeluar = colMap.keluar !== -1 ? parseNumericCell(cells[colMap.keluar]) : 0;
          var kepadaDariVal = colMap.kepadaDari !== -1 ? String(cells[colMap.kepadaDari] || '').trim() : '';
          if (rawKeluar > 0 && kepadaDariVal) {
            rawTujuan = kepadaDariVal;
          } else if ((rawMasuk > 0 || rawAwal > 0) && kepadaDariVal && !rawDonor) {
            rawDonor = kepadaDariVal;
          }
        }

        // Lewati baris kosong
        if (!rawNama && !rawKode && rawAwal === 0 && rawMasuk === 0 && rawKeluar === 0 && !rawExp) {
          continue;
        }

        // Deteksi baris ringkasan akhir blok item pada Sheet 1 (dimana Nama, Tanggal, Kepada/Dari, Ex-date, Catatan kosong tetapi mengulang total Masuk/Saldo blok di atasnya)
        if (
          !rawNama &&
          !rawKode &&
          !rawNo &&
          !rawTanggal &&
          !rawTujuan &&
          !rawExp &&
          !rawKet &&
          activeMasterCtx &&
          blockRunningIn > 0 &&
          rawMasuk === blockRunningIn &&
          rawKeluar === blockRunningOut
        ) {
          continue;
        }

        var isNewItemHeader = Boolean(rawNama);
        if (isNewItemHeader) {
          var formattedKode = rawKode || rawNo;
          if (!formattedKode || /^\d+$/.test(formattedKode)) {
            var pref = sheetCategory === 'FOOD ITEMS' ? 'FD' : (sheetCategory === 'NON FOOD' ? 'NF' : 'OB');
            var numSeq = /^\d+$/.test(formattedKode) ? formattedKode : String(Object.keys(seenMasterKeysInSheet).length + 1);
            formattedKode = pref + '-' + ('0000' + numSeq).slice(-4);
          }

          activeMasterCtx = {
            kode_barang: formattedKode,
            nama_barang: rawNama,
            satuan: rawSatuan || 'Unit',
            harga_unit: rawHarga,
            sumber_donor: rawDonor || '-'
          };
          blockRunningIn = 0;
          blockRunningOut = 0;
        }

        if (!activeMasterCtx) continue;

        // Perbarui satuan/harga/donor konteks jika baru muncul di baris lanjutan
        if (rawSatuan && activeMasterCtx.satuan === 'Unit') activeMasterCtx.satuan = rawSatuan;
        if (rawHarga > 0 && activeMasterCtx.harga_unit === 0) activeMasterCtx.harga_unit = rawHarga;
        if (rawDonor && activeMasterCtx.sumber_donor === '-') activeMasterCtx.sumber_donor = rawDonor;

        blockRunningIn += (rawAwal + rawMasuk);
        blockRunningOut += rawKeluar;

        var itemIdentityKey = sheetCategory + '::' + activeMasterCtx.kode_barang;
        var rowType = 'MASTER + SALDO';
        if (!isNewItemHeader) {
          rowType = (rawAwal === 0 && rawMasuk === 0 && rawKeluar === 0 && rawExp)
            ? 'KOMPONEN EXPIRED'
            : 'TRANSAKSI LANJUTAN';
        } else if (seenMasterKeysInSheet[itemIdentityKey]) {
          rowType = 'TRANSAKSI ITEM SAMA';
        } else {
          seenMasterKeysInSheet[itemIdentityKey] = true;
        }

        parsedRows.push({
          _rowNumber: rowIdx + 1,
          _sheetName: sheetName,
          _rowType: rowType,
          kategori: sheetCategory,
          kode_barang: isNewItemHeader ? activeMasterCtx.kode_barang : '',
          nama_barang: isNewItemHeader ? activeMasterCtx.nama_barang : '',
          _displayNama: activeMasterCtx.nama_barang,
          _displayKode: activeMasterCtx.kode_barang,
          satuan: activeMasterCtx.satuan,
          harga_unit: rawHarga > 0 ? rawHarga : activeMasterCtx.harga_unit,
          sumber_donor: rawDonor || activeMasterCtx.sumber_donor,
          tujuan_distribusi: rawTujuan,
          no_request: rawReq,
          stok_awal: rawAwal,
          barang_masuk: rawMasuk,
          barang_keluar: rawKeluar,
          saldo_stok: rawSaldo,
          expired_date: rawExp,
          no_grn: rawGrn,
          no_gdn: rawGdn,
          tanggal: rawTanggal,
          keterangan: rawKet || rawTujuan
        });
      }
    }

    APP_STATE.excelParsedRows = parsedRows;
    document.getElementById('excelPreviewCountBadge').textContent = parsedRows.length + ' Baris Valid Terbaca';
    document.getElementById('btnExecuteImportExcel').disabled = parsedRows.length === 0;

    var tbody = document.getElementById('excelPreviewTableBody');
    if (parsedRows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="12" class="text-center text-muted py-4">Tidak ditemukan baris data barang/transaksi yang valid pada sheet tersebut.</td></tr>';
      return;
    }

    var html = '';
    for (var i = 0; i < Math.min(parsedRows.length, 150); i++) {
      var r = parsedRows[i];
      var typeBadge = r._rowType === 'MASTER + SALDO'
        ? '<span class="badge bg-danger bg-opacity-10 text-danger">Master &amp; Mutasi</span>'
        : (r._rowType === 'KOMPONEN EXPIRED'
          ? '<span class="badge bg-warning bg-opacity-15 text-dark">Detail Expired</span>'
          : '<span class="badge bg-primary bg-opacity-10 text-primary">Baris Transaksi</span>');
      html +=
        '<tr>' +
          '<td class="text-muted">' + r._rowNumber + '</td>' +
          '<td>' + renderCategoryBadge(r.kategori) + '</td>' +
          '<td class="fw-bold">' + escapeHtml(r.kode_barang || ('↳ ' + r._displayKode)) + '</td>' +
          '<td class="fw-bold">' + escapeHtml(r.nama_barang || ('↳ ' + r._displayNama)) + '</td>' +
          '<td>' + escapeHtml(r.satuan) + '</td>' +
          '<td class="text-end">' + formatNumber(r.harga_unit) + '</td>' +
          '<td>' + escapeHtml(r.tujuan_distribusi ? ('Ke: ' + r.tujuan_distribusi) : r.sumber_donor) + '</td>' +
          '<td class="text-end">' + formatNumber(r.stok_awal) + '</td>' +
          '<td class="text-end text-success">+' + formatNumber(r.barang_masuk) + '</td>' +
          '<td class="text-end text-danger">-' + formatNumber(r.barang_keluar) + '</td>' +
          '<td>' + escapeHtml(r.expired_date || '-') + '</td>' +
          '<td>' + typeBadge + '</td>' +
        '</tr>';
    }
    tbody.innerHTML = html;
  }

  function detectSheetColumnMapping(headers, topHeaders) {
    var map = {
      no: -1, kode: -1, nama: -1, satuan: -1, harga: -1, donor: -1,
      request: -1, gdn: -1, grn: -1, tanggal: -1, kepadaDari: -1,
      awal: -1, masuk: -1, keluar: -1, saldo: -1, expired: -1, ket: -1,
      isFormatInOutTotal: false, inDari: -1, outKepada: -1, totalQty: -1
    };

    var joinedAll = headers.join(' | ');
    if (joinedAll.indexOf('IN DARI') !== -1 && joinedAll.indexOf('OUT KEPADA') !== -1) {
      map.isFormatInOutTotal = true;
    }

    for (var i = 0; i < headers.length; i++) {
      var h = headers[i];
      if (!h) continue;

      if (map.no === -1 && (h === 'NO' || h === 'NO.' || h === 'NR')) map.no = i;
      else if (map.kode === -1 && (h.indexOf('KODE') !== -1 || h.indexOf('CODE') !== -1)) map.kode = i;
      else if (map.nama === -1 && (h.indexOf('NAMA BARANG') !== -1 || h.indexOf('JENIS BARANG') !== -1 || h.indexOf('DESCRIPTION') !== -1 || h === 'BARANG')) map.nama = i;
      else if (map.harga === -1 && (h.indexOf('HARGA') !== -1 || h.indexOf('PRICE') !== -1)) map.harga = i;
      else if (map.donor === -1 && (h.indexOf('DONOR') !== -1 || h.indexOf('SUMBER') !== -1)) map.donor = i;
      else if (map.request === -1 && (h.indexOf('REQUEST') !== -1 || h.indexOf('REQST') !== -1)) map.request = i;
      else if (map.gdn === -1 && h.indexOf('GDN') !== -1) map.gdn = i;
      else if (map.grn === -1 && h.indexOf('GRN') !== -1) map.grn = i;
      else if (map.tanggal === -1 && (h.indexOf('TANGGAL') !== -1 || h.indexOf('TGL') !== -1 || h.indexOf('DATE') !== -1) && h.indexOf('EX') === -1) map.tanggal = i;
      else if (map.inDari === -1 && h.indexOf('IN DARI') !== -1) map.inDari = i;
      else if (map.outKepada === -1 && h.indexOf('OUT KEPADA') !== -1) map.outKepada = i;
      else if (map.totalQty === -1 && h.indexOf('TOTAL JUMLAH') !== -1) map.totalQty = i;
      else if (map.kepadaDari === -1 && (h.indexOf('KEPADA') !== -1 || h === 'DARI')) map.kepadaDari = i;
      else if (map.awal === -1 && (h.indexOf('AWAL') !== -1 || h.indexOf('OPENING') !== -1)) map.awal = i;
      else if (map.masuk === -1 && (h.indexOf('MASUK') !== -1 || h === 'IN' || h.indexOf('PENERIMAAN') !== -1)) map.masuk = i;
      else if (map.keluar === -1 && (h.indexOf('KELUAR') !== -1 || h === 'OUT' || h.indexOf('PENGELUARAN') !== -1)) map.keluar = i;
      else if (map.saldo === -1 && (h.indexOf('BALANCE') !== -1 || h.indexOf('SALDO') !== -1 || h.indexOf('STOK AKHIR') !== -1)) map.saldo = i;
      else if (map.satuan === -1 && (h.indexOf('SATUAN') !== -1 || h.indexOf('UNIT') !== -1) && h.indexOf('HARGA') === -1) map.satuan = i;
      else if (map.expired === -1 && (h.indexOf('EX-DATE') !== -1 || h.indexOf('EXPIRED') !== -1 || h.indexOf('KEDALUWARSA') !== -1 || h.indexOf('KADALUARSA') !== -1)) map.expired = i;
      else if (map.ket === -1 && (h.indexOf('CATATAN') !== -1 || h.indexOf('KETERANGAN') !== -1 || h.indexOf('REMARK') !== -1)) map.ket = i;
    }

    if (map.nama === -1 && headers.length >= 2) {
      map.nama = 1;
    }
    if (map.kode === -1 && map.no !== -1) {
      map.kode = map.no;
    }
    return map;
  }

  function executeConfirmedExcelImport() {
    if (!APP_STATE.excelParsedRows || APP_STATE.excelParsedRows.length === 0) return;

    showCustomPopup({
      variant: 'info',
      icon: 'bi-cloud-arrow-up-fill',
      title: 'Import Data Excel ke Database?',
      message: 'Sistem akan memproses dan menyinkronkan data Master Barang serta Transaksi ke Google Spreadsheet PMI Kota Surakarta.',
      detailHtml:
        '<div class="d-flex align-items-center justify-content-between">' +
          '<span class="fw-bold text-dark"><i class="bi bi-file-earmark-spreadsheet-fill text-success me-1"></i> Total Baris Siap Import:</span>' +
          '<span class="badge bg-danger fs-6">' + formatNumber(APP_STATE.excelParsedRows.length) + ' Baris</span>' +
        '</div>',
      cancelText: 'Periksa Lagi',
      confirmText: 'Ya, Import Sekarang',
      confirmIcon: 'bi-cloud-upload-fill'
    }).then(function(confirmed) {
      if (!confirmed) return;

      callServerApi('IMPORT_EXCEL_DATA', { rows: APP_STATE.excelParsedRows })
        .then(function(res) {
          var st = res.data;
          var alertBox = document.getElementById('importResultAlertBox');
          alertBox.className = 'mt-4 alert alert-success rounded-4';
          alertBox.innerHTML =
            '<h6 class="fw-bolder mb-2"><i class="bi bi-check-circle-fill me-1"></i> Laporan Hasil Migrasi Data Excel:</h6>' +
            '<ul class="small mb-0">' +
              '<li>Total Baris Diproses: <strong>' + st.totalRowsProcessed + '</strong></li>' +
              '<li>Master Barang Baru Dibuat: <strong>' + st.masterCreated + '</strong></li>' +
              '<li>Master Barang Terhubung (Existing): <strong>' + st.masterMatched + '</strong></li>' +
              '<li>Transaksi Barang Masuk Dibuat: <strong>' + st.transaksiMasukCreated + '</strong></li>' +
              '<li>Transaksi Barang Keluar Dibuat: <strong>' + st.transaksiKeluarCreated + '</strong></li>' +
              '<li>Baris Dilewati / Gagal: <strong>' + st.skippedOrFailed + '</strong></li>' +
            '</ul>';
          alertBox.classList.remove('d-none');
          showToast(res.message, 'success');
          syncInitialBundleSilently();
        });
    });
  }

  /**
   * Membuat dan mengunduh file template/contoh Stock Report Gudang PB.xlsx
   * yang memiliki 3 sheet: "Food Items", "Non Food", dan "Obat"
   */
  function downloadSampleExcelTemplate() {
    if (typeof XLSX === 'undefined') {
      showToast('Library SheetJS belum siap.', 'warning');
      return;
    }

    var wb = XLSX.utils.book_new();

  /* ==========================================================================
   * 14. MANAJEMEN PENGGUNA, PENGATURAN, BACKUP & LOG AKTIVITAS (BAB 11 & 14)
   * ========================================================================== */
  function loadUsersAndSettingsData() {
    if (!APP_STATE.permissions.canManageUsers) return;

    Promise.all([
      callServerApi('GET_USERS', {}, { silent: true }),
      callServerApi('GET_LOGS_AND_SETTINGS', {}, { loadingTitle: 'Memuat Pengguna & Audit Log...' })
    ]).then(function(results) {
      APP_STATE.usersList = results[0].data || [];
      var logs = results[1].data.logs || [];
      var settingsArr = results[1].data.settings || [];

      renderUsersTable(APP_STATE.usersList);
      renderActivityLogTable(logs);

      var sMap = {};
      for (var i = 0; i < settingsArr.length; i++) {
        sMap[settingsArr[i].setting_key] = settingsArr[i].setting_value;
      }
      APP_STATE.settings = Object.assign(APP_STATE.settings, sMap);

      document.getElementById('setNamaInstansi').value = APP_STATE.settings.NAMA_INSTANSI || '';
      document.getElementById('setAlamatInstansi').value = APP_STATE.settings.ALAMAT_INSTANSI || '';
      document.getElementById('setTeleponInstansi').value = APP_STATE.settings.TELEPON_INSTANSI || '';
      document.getElementById('setNamaKepalaMarkas').value = APP_STATE.settings.NAMA_KEPALA_MARKAS || '';
      document.getElementById('setNamaKoordinatorGudang').value = APP_STATE.settings.NAMA_KOORDINATOR_GUDANG || '';
    });
  }

  function renderUsersTable(users) {
    var tbody = document.getElementById('usersTableBody');
    var html = '';
    for (var i = 0; i < users.length; i++) {
      var u = users[i];
      var roleBadge = u.role === 'ADMIN'
        ? '<span class="badge bg-danger">ADMIN</span>'
        : (u.role === 'PIMPINAN' ? '<span class="badge bg-primary">PIMPINAN</span>' : '<span class="badge bg-dark">PETUGAS GUDANG</span>');
      var stBadge = u.status_aktif === 'AKTIF'
        ? '<span class="badge-pmi badge-aman">AKTIF</span>'
        : '<span class="badge-pmi badge-expired">NONAKTIF</span>';

      html +=
        '<tr>' +
          '<td class="fw-bold">' + escapeHtml(u.username) + '</td>' +
          '<td>' + escapeHtml(u.nama_lengkap) + '</td>' +
          '<td>' + roleBadge + '</td>' +
          '<td>' + escapeHtml(u.jabatan || '-') + '</td>' +
          '<td>' + stBadge + '</td>' +
          '<td class="small text-muted">' + escapeHtml(u.last_login || 'Belum pernah') + '</td>' +
          '<td class="text-center">' +
            '<button class="btn btn-sm btn-light border" onclick="openUserModal(\'' + u.id_user + '\')"><i class="bi bi-pencil-square"></i> Edit</button>' +
          '</td>' +
        '</tr>';
    }
    tbody.innerHTML = html;
  }

  function renderActivityLogTable(logs) {
    var tbody = document.getElementById('activityLogTableBody');
    if (!logs || logs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-3">Belum ada log aktivitas.</td></tr>';
      return;
    }
    var html = '';
    for (var i = 0; i < logs.length; i++) {
      var l = logs[i];
      html +=
        '<tr>' +
          '<td class="small text-muted">' + escapeHtml(l.timestamp) + '</td>' +
          '<td class="fw-bold">' + escapeHtml(l.nama_user) + ' <span class="text-muted small">(' + escapeHtml(l.username) + ')</span></td>' +
          '<td><span class="badge bg-light text-dark border">' + escapeHtml(l.role) + '</span></td>' +
          '<td class="fw-bold text-danger small">' + escapeHtml(l.modul) + '</td>' +
          '<td><span class="badge bg-secondary">' + escapeHtml(l.aksi) + '</span></td>' +
          '<td class="small fw-bold">' + escapeHtml(l.referensi_id) + '</td>' +
          '<td class="small">' + escapeHtml(l.detail_aktivitas) + '</td>' +
        '</tr>';
    }
    tbody.innerHTML = html;
  }

  function openUserModal(idUser) {
    var form = document.getElementById('formUserAccount');
    form.reset();
    document.getElementById('usrIdUser').value = '';

    if (idUser) {
      var u = APP_STATE.usersList.find(function(x) { return x.id_user === idUser; });
      if (!u) return;
      document.getElementById('modalUserTitle').textContent = 'Edit Akun Pengguna (' + u.username + ')';
      document.getElementById('usrIdUser').value = u.id_user;
      document.getElementById('usrUsername').value = u.username;
      document.getElementById('usrNamaLengkap').value = u.nama_lengkap;
      document.getElementById('usrRole').value = u.role;
      document.getElementById('usrStatusAktif').value = u.status_aktif || 'AKTIF';
      document.getElementById('usrJabatan').value = u.jabatan || '';
      document.getElementById('usrEmail').value = u.email || '';
      document.getElementById('usrNoHp').value = u.no_hp || '';
      document.getElementById('usrPassHint').textContent = '(Kosongkan jika tidak ingin mengubah password)';
    } else {
      document.getElementById('modalUserTitle').textContent = 'Tambah Pengguna Baru';
      document.getElementById('usrPassHint').textContent = '(Wajib diisi minimal 6 karakter)';
    }

    new bootstrap.Modal(document.getElementById('modalUserAccount')).show();
  }

  function handleSaveUserAccount(e) {
    e.preventDefault();
    var payload = {
      id_user: document.getElementById('usrIdUser').value,
      username: document.getElementById('usrUsername').value.trim(),
      password: document.getElementById('usrPassword').value,
      nama_lengkap: document.getElementById('usrNamaLengkap').value.trim(),
      role: document.getElementById('usrRole').value,
      status_aktif: document.getElementById('usrStatusAktif').value,
      jabatan: document.getElementById('usrJabatan').value.trim(),
      email: document.getElementById('usrEmail').value.trim(),
      no_hp: document.getElementById('usrNoHp').value.trim()
    };

    callServerApi('SAVE_USER', payload, { loadingTitle: 'Menyimpan Akun Pengguna...' })
      .then(function(res) {
        bootstrap.Modal.getInstance(document.getElementById('modalUserAccount')).hide();
        showToast(res.message, 'success');
        loadUsersAndSettingsData();
      });
  }

  function handleSaveSettings(e) {
    e.preventDefault();
    var payload = {
      NAMA_INSTANSI: document.getElementById('setNamaInstansi').value.trim(),
      ALAMAT_INSTANSI: document.getElementById('setAlamatInstansi').value.trim(),
      TELEPON_INSTANSI: document.getElementById('setTeleponInstansi').value.trim(),
      NAMA_KEPALA_MARKAS: document.getElementById('setNamaKepalaMarkas').value.trim(),
      NAMA_KOORDINATOR_GUDANG: document.getElementById('setNamaKoordinatorGudang').value.trim()
    };
    callServerApi('SAVE_SETTINGS', payload, { loadingTitle: 'Menyimpan Konfigurasi Instansi...' })
      .then(function(res) {
        APP_STATE.settings = Object.assign(APP_STATE.settings, payload);
        showToast(res.message, 'success');
      });
  }

  function triggerManualBackup() {
    callServerApi('BACKUP_DATABASE', {}, { loadingTitle: 'Membuat Salinan Backup Database di Google Drive...' })
      .then(function(res) {
        showToast(res.message + ' (' + res.data.backupName + ')', 'success');
        loadUsersAndSettingsData();
      });
  }

  function renderPaginationControls(containerId, currentPage, totalPages, callbackName) {
    var el = document.getElementById(containerId);
    if (!el) return;
    if (totalPages <= 1) {
      el.innerHTML = '';
      return;
    }
    var html = '';
    var prevPage = Math.max(1, currentPage - 1);
    var nextPage = Math.min(totalPages, currentPage + 1);
    html += '<button class="btn btn-outline-secondary" ' + (currentPage === 1 ? 'disabled' : '') + ' onclick="' + callbackName + '(' + prevPage + ')">&laquo;</button>';
    for (var p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 2) {
        var activeCls = p === currentPage ? 'btn-danger text-white' : 'btn-outline-secondary';
        html += '<button class="btn ' + activeCls + '" onclick="' + callbackName + '(' + p + ')">' + p + '</button>';
      }
    }
    html += '<button class="btn btn-outline-secondary" ' + (currentPage === totalPages ? 'disabled' : '') + ' onclick="' + callbackName + '(' + nextPage + ')">&raquo;</button>';
    el.innerHTML = html;
  }

  function readFileAsBase64(fileInput) {
    return new Promise(function(resolve) {
      if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        resolve(null);
        return;
      }
      var file = fileInput.files[0];
      var reader = new FileReader();
      reader.onload = function(evt) {
        resolve({
          base64: evt.target.result,
          name: file.name,
          mime: file.type
        });
      };
      reader.onerror = function() { resolve(null); };
      reader.readAsDataURL(file);
    });
  }

  function parseNumericCell(val) {
    if (typeof val === 'number') return isNaN(val) ? 0 : val;
    if (!val) return 0;
    var s = String(val).replace(/[Rp\s,]/gi, '');
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  function formatClientDateISO(val) {
    if (!val) return '';
    if (val instanceof Date && !isNaN(val.getTime())) {
      return val.toISOString().substring(0, 10);
    }
    var s = String(val).trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0, 10);
    var d = new Date(s);
    if (!isNaN(d.getTime())) return d.toISOString().substring(0, 10);
    return '';
  }
