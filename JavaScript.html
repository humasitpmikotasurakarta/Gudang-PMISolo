  <script>
  /* ==========================================================================
   * SISTEM INFORMASI MANAJEMEN STOK GUDANG - PMI KOTA SURAKARTA
   * File: JavaScript.html
   * Deskripsi: Controller Frontend Utama, Integrasi Google Apps Script API,
   *            Render Chart.js, Parsing Migrasi Excel (SheetJS), Cetak Dokumen
   *            Resmi (GRN, GDN, Kartu Stok, Berita Acara Opname, 12 Laporan).
   * ========================================================================== */

  var APP_STATE = {
    token: localStorage.getItem('PMI_SKA_SESSION_TOKEN') || '',
    user: null,
    permissions: {},
    settings: {
      NAMA_INSTANSI: 'PALANG MERAH INDONESIA KOTA SURAKARTA',
      ALAMAT_INSTANSI: 'Jl. Kolonel Sutarto No. 58, Jebres, Kota Surakarta, Jawa Tengah 57126',
      TELEPON_INSTANSI: '(0271) 646505 | Email: kota_surakarta@pmi.or.id',
      NAMA_KEPALA_MARKAS: 'Wanto, S.KM.',
      NAMA_KOORDINATOR_GUDANG: 'Indro Sri Widodo'
    },
    activeView: 'dashboard',
    masterBarang: [],
    donors: [],
    transaksiMasuk: [],
    nextAutoNumberIn: 'BM-202611-0001',
    transaksiKeluar: [],
    nextAutoNumberOut: 'BK-202611-0001',
    stockOpnameList: [],
    nextAutoNumberOpname: 'SO-202611-0001',
    expiredMonitoringList: [],
    expiredSummary: { kedaluwarsa: 0, segeraKedaluwarsa: 0, perhatian: 0, aman: 0 },
    dashboardData: null,
    bundleLoaded: false,
    activeKartuStok: null,
    activeReportData: null,
    usersList: [],
    excelWorkbook: null,
    excelParsedRows: [],
    pagination: {
      masterPage: 1,
      inPage: 1,
      outPage: 1,
      pageSize: 10
    },
    charts: {
      monthlyInOut: null,
      stokKategori: null,
      nilaiPersediaan: null,
      distribusiKategori: null
    }
  };

  /* ==========================================================================
   * 1. INISIALISASI SAAT HALAMAN DIMUAT & CACHE INSTAN (0ms)
   * ========================================================================== */
  var FAST_CACHE_KEY = 'PMI_SKA_FAST_CACHE_V1';

  function saveFastStateCache() {
    try {
      var snapshot = {
        user: APP_STATE.user,
        permissions: APP_STATE.permissions,
        settings: APP_STATE.settings,
        masterBarang: APP_STATE.masterBarang,
        donors: APP_STATE.donors,
        transaksiMasuk: APP_STATE.transaksiMasuk,
        nextAutoNumberIn: APP_STATE.nextAutoNumberIn,
        transaksiKeluar: APP_STATE.transaksiKeluar,
        nextAutoNumberOut: APP_STATE.nextAutoNumberOut,
        stockOpnameList: APP_STATE.stockOpnameList,
        nextAutoNumberOpname: APP_STATE.nextAutoNumberOpname,
        expiredMonitoringList: APP_STATE.expiredMonitoringList,
        expiredSummary: APP_STATE.expiredSummary,
        dashboardData: APP_STATE.dashboardData
      };
      localStorage.setItem(FAST_CACHE_KEY, JSON.stringify(snapshot));
    } catch (e) {}
  }

  function restoreFastStateCache() {
    try {
      var raw = localStorage.getItem(FAST_CACHE_KEY);
      if (!raw) return false;
      var snap = JSON.parse(raw);
      if (!snap) return false;
      if (snap.user) APP_STATE.user = snap.user;
      if (snap.permissions) APP_STATE.permissions = snap.permissions;
      if (snap.settings) APP_STATE.settings = Object.assign(APP_STATE.settings, snap.settings);
      if (Array.isArray(snap.masterBarang)) APP_STATE.masterBarang = snap.masterBarang;
      if (Array.isArray(snap.donors)) APP_STATE.donors = snap.donors;
      if (Array.isArray(snap.transaksiMasuk)) APP_STATE.transaksiMasuk = snap.transaksiMasuk;
      if (snap.nextAutoNumberIn) APP_STATE.nextAutoNumberIn = snap.nextAutoNumberIn;
      if (Array.isArray(snap.transaksiKeluar)) APP_STATE.transaksiKeluar = snap.transaksiKeluar;
      if (snap.nextAutoNumberOut) APP_STATE.nextAutoNumberOut = snap.nextAutoNumberOut;
      if (Array.isArray(snap.stockOpnameList)) APP_STATE.stockOpnameList = snap.stockOpnameList;
      if (snap.nextAutoNumberOpname) APP_STATE.nextAutoNumberOpname = snap.nextAutoNumberOpname;
      if (Array.isArray(snap.expiredMonitoringList)) APP_STATE.expiredMonitoringList = snap.expiredMonitoringList;
      if (snap.expiredSummary) APP_STATE.expiredSummary = snap.expiredSummary;
      if (snap.dashboardData) APP_STATE.dashboardData = snap.dashboardData;
      return Boolean(APP_STATE.user);
    } catch (e) {
      return false;
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    var todayStr = new Date().toISOString().substring(0, 10);
    document.getElementById('inTanggal').value = todayStr;
    document.getElementById('outTanggal').value = todayStr;
    document.getElementById('soTanggalJadwal').value = todayStr;
    document.getElementById('soTanggalPeriksa').value = todayStr;

    var opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('currentDateHeaderDisplay').textContent =
      new Date().toLocaleDateString('id-ID', opts) + ' | Gudang PB';

    if (APP_STATE.token) {
      // Tampilkan aplikasi secara instan (0ms) dari snapshot lokal jika tersedia, lalu sinkronkan di background
      if (restoreFastStateCache()) {
        enterAuthenticatedApp(true);
      }
      verifyExistingSession();
    }
  });

  /* ==========================================================================
   * 2. JEMBATAN KOMUNIKASI SERVER (UNIVERSAL BRIDGE: GAS NATIVE + VERCEL <-> GAS)
   * ==========================================================================
   * Mendukung 3 mode otomatis:
   * 1. Native Google Apps Script (google.script.run) jika dibuka dari URL script.google.com
   * 2. Vercel -> Google Apps Script REST API (HTTP POST doPost bebas-CORS dengan
   *    Content-Type: text/plain;charset=utf-8 atau lewat /api/gas Serverless Proxy)
   * 3. Fallback Preview Lokal jika dibuka offline / mode demo
   * ========================================================================== */
  var DEFAULT_GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxHdzDpsqR3BftxscXXwA_t2bTDN9QtjKj-vX4bG_JHc2cqYU2KR0pCFyTgbMZexe97/exec';

  function getGasWebAppUrl() {
    return (
      localStorage.getItem('PMI_SKA_GAS_WEB_APP_URL') ||
      window.PMI_GAS_WEB_APP_URL ||
      DEFAULT_GAS_WEB_APP_URL
    ).trim();
  }

  function updateConnectionModeBadge() {
    var el = document.getElementById('gasConnectionModeLabel');
    if (!el) return;
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      el.textContent = 'GAS Native (Direct)';
    } else {
      var url = getGasWebAppUrl();
      if (url && url !== 'LOCAL_DEMO') {
        el.textContent = 'Vercel \u2194 GAS Cloud API';
      } else {
        el.textContent = 'Mode Demo Lokal';
      }
    }
  }

  function openGasUrlConfigPopup() {
    var currentUrl = getGasWebAppUrl();
    showCustomPopup({
      mode: 'prompt',
      variant: 'info',
      icon: 'bi-cloud-arrow-up-fill',
      title: 'Konfigurasi URL Google Apps Script',
      message: 'Masukkan URL Deployment Web App Google Apps Script (berakhiran /exec) agar aplikasi di Vercel terhubung langsung ke Google Spreadsheet Anda.',
      detailHtml:
        '<div class="small">' +
          '<div><strong>Tips Deployment GAS:</strong></div>' +
          '<div>1. Di Editor GAS klik <strong>Deploy &rarr; New deployment (Web app)</strong></div>' +
          '<div>2. Set <em>Execute as:</em> <strong>Me</strong> &amp; <em>Who has access:</em> <strong>Anyone</strong></div>' +
          '<div>3. Salin URL <code>https://script.google.com/macros/s/.../exec</code></div>' +
        '</div>',
      inputLabel: 'URL WEB APP GOOGLE APPS SCRIPT (/exec)',
      defaultValue: currentUrl,
      inputPlaceholder: 'https://script.google.com/macros/s/.../exec',
      cancelText: 'Batal',
      confirmText: 'Simpan & Hubungkan',
      confirmIcon: 'bi-check2-circle'
    }).then(function(newUrl) {
      if (newUrl === null) return;
      var clean = String(newUrl || '').trim();
      if (!clean || clean === '-') {
        localStorage.removeItem('PMI_SKA_GAS_WEB_APP_URL');
        showToast('URL GAS dikembalikan ke pengaturan default.', 'success');
      } else {
        localStorage.setItem('PMI_SKA_GAS_WEB_APP_URL', clean);
        showToast('URL Google Apps Script berhasil disimpan!', 'success');
      }
      updateConnectionModeBadge();
    });
  }

  function callServerApi(action, payload, options) {
    updateConnectionModeBadge();
    var requestObj = {
      action: action,
      token: APP_STATE.token,
      payload: payload || {}
    };

    return new Promise(function(resolve, reject) {
      // 1. Jika berjalan langsung di dalam iframe Google Apps Script
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(response) {
            if (!response) {
              showToast('Respons server kosong.', 'danger');
              reject(new Error('Respons server kosong'));
              return;
            }
            if (!response.success) {
              if (response.code === 'UNAUTHORIZED') {
                handleForceLogout(response.message);
              } else {
                showToast(response.message || 'Terjadi kesalahan.', 'danger');
              }
              reject(new Error(response.message || 'Error'));
              return;
            }
            resolve(response);
          })
          .withFailureHandler(function(err) {
            var msg = (err && err.message) ? err.message : String(err);
            showToast('Gagal menghubungi server: ' + msg, 'danger');
            reject(err);
          })
          .processApiRequest(requestObj);
        return;
      }

      // 2. Jika di-deploy di Vercel / Hosting Eksternal -> Panggil doPost(e) di Google Apps Script
      var gasUrl = getGasWebAppUrl();
      if (gasUrl && gasUrl !== 'LOCAL_DEMO' && gasUrl.indexOf('https://script.google.com/') === 0) {
        // Gunakan Content-Type: text/plain;charset=utf-8 agar tidak memicu CORS preflight (OPTIONS) di GAS
        fetch(gasUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(requestObj),
          redirect: 'follow'
        })
          .then(function(httpRes) {
            return httpRes.text();
          })
          .then(function(rawText) {
            var response = null;
            try {
              response = JSON.parse(rawText);
            } catch (parseErr) {
              // Jika GAS belum di-deploy ulang dengan fungsi doPost(e), coba lewat Vercel Serverless Proxy /api/gas atau fallback
              throw new Error('INVALID_GAS_JSON');
            }
            if (!response) {
              showToast('Respons server GAS kosong.', 'danger');
              reject(new Error('Respons server kosong'));
              return;
            }
            if (!response.success) {
              if (response.code === 'UNAUTHORIZED') {
                handleForceLogout(response.message);
              } else {
                showToast(response.message || 'Terjadi kesalahan.', 'danger');
              }
              reject(new Error(response.message || 'Error'));
              return;
            }
            resolve(response);
          })
          .catch(function(err) {
            // Coba lewat Vercel Serverless Proxy (/api/gas) jika tersedia, atau gunakan fallback lokal bila belum dideploy
            if (window.location.protocol !== 'file:' && err && err.message !== 'INVALID_GAS_JSON') {
              fetch('/api/gas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(Object.assign({}, requestObj, { _gasUrl: gasUrl }))
              })
                .then(function(proxyRes) { return proxyRes.json(); })
                .then(function(proxyData) {
                  if (proxyData && proxyData.success) {
                    resolve(proxyData);
                  } else if (proxyData && proxyData.message && !proxyData._fallback) {
                    if (proxyData.code === 'UNAUTHORIZED') handleForceLogout(proxyData.message);
                    else showToast(proxyData.message, 'danger');
                    reject(new Error(proxyData.message));
                  } else {
                    throw new Error('PROXY_FALLBACK');
                  }
                })
                .catch(function() {
                  var localRes = handleLocalPreviewFallback(requestObj);
                  if (!localRes.success) {
                    showToast(localRes.message, 'danger');
                    reject(new Error(localRes.message));
                  } else {
                    resolve(localRes);
                  }
                });
            } else {
              var localRes2 = handleLocalPreviewFallback(requestObj);
              if (!localRes2.success) {
                showToast(localRes2.message, 'danger');
                reject(new Error(localRes2.message));
              } else {
                resolve(localRes2);
              }
            }
          });
        return;
      }

      // 3. Fallback instan (0ms) jika dalam mode demo lokal
      var localRes = handleLocalPreviewFallback(requestObj);
      if (!localRes.success) {
        showToast(localRes.message, 'danger');
        reject(new Error(localRes.message));
      } else {
        resolve(localRes);
      }
    });
  }

  function showLoading() {
    // Loading berjalan secara silent di background agar tidak terlihat oleh pengguna
  }

  function hideLoading() {
    // No-op
  }

  /* ==========================================================================
   * 2B. MODERN CUSTOM POPUP ENGINE (CONFIRM & PROMPT)
   * ========================================================================== */
  var _ACTIVE_POPUP_RESOLVER = null;
  var _ACTIVE_POPUP_MODE = 'confirm';

  function showCustomPopup(options) {
    var opts = options || {};
    _ACTIVE_POPUP_MODE = opts.mode || 'confirm';

    var overlay = document.getElementById('pmiCustomPopupOverlay');
    var card = document.getElementById('pmiPopupCard');
    var iconEl = document.getElementById('pmiPopupIcon');
    var titleEl = document.getElementById('pmiPopupTitle');
    var msgEl = document.getElementById('pmiPopupMessage');
    var detailBox = document.getElementById('pmiPopupDetailBox');
    var inputWrap = document.getElementById('pmiPopupInputWrap');
    var inputLabel = document.getElementById('pmiPopupInputLabel');
    var inputEl = document.getElementById('pmiPopupInput');
    var cancelBtn = document.getElementById('pmiPopupCancelBtn');
    var confirmText = document.getElementById('pmiPopupConfirmText');
    var confirmIcon = document.getElementById('pmiPopupConfirmIcon');

    card.setAttribute('data-variant', opts.variant || 'danger');
    iconEl.className = 'bi ' + (opts.icon || 'bi-exclamation-triangle-fill');
    titleEl.textContent = opts.title || 'Konfirmasi Tindakan';
    msgEl.textContent = opts.message || 'Apakah Anda yakin ingin melanjutkan?';

    if (opts.detailHtml) {
      detailBox.innerHTML = opts.detailHtml;
      detailBox.classList.remove('d-none');
    } else {
      detailBox.innerHTML = '';
      detailBox.classList.add('d-none');
    }

    if (_ACTIVE_POPUP_MODE === 'prompt') {
      inputWrap.classList.remove('d-none');
      inputLabel.textContent = opts.inputLabel || 'ALASAN / CATATAN';
      inputEl.value = opts.defaultValue !== undefined ? opts.defaultValue : '';
      inputEl.placeholder = opts.inputPlaceholder || 'Ketik alasan di sini...';
    } else {
      inputWrap.classList.add('d-none');
      inputEl.value = '';
    }

    cancelBtn.textContent = opts.cancelText || 'Batal';
    confirmText.textContent = opts.confirmText || 'Ya, Lanjutkan';
    confirmIcon.className = 'bi ' + (opts.confirmIcon || 'bi-check2-circle');

    overlay.classList.add('show');

    setTimeout(function() {
      if (_ACTIVE_POPUP_MODE === 'prompt') {
        inputEl.focus();
        inputEl.select();
      } else {
        document.getElementById('pmiPopupConfirmBtn').focus();
      }
    }, 80);

    return new Promise(function(resolve) {
      _ACTIVE_POPUP_RESOLVER = resolve;
    });
  }

  function resolveCustomPopup(confirmed) {
    var overlay = document.getElementById('pmiCustomPopupOverlay');
    var inputEl = document.getElementById('pmiPopupInput');
    overlay.classList.remove('show');

    if (!_ACTIVE_POPUP_RESOLVER) return;
    var resolver = _ACTIVE_POPUP_RESOLVER;
    _ACTIVE_POPUP_RESOLVER = null;

    if (_ACTIVE_POPUP_MODE === 'prompt') {
      resolver(confirmed ? (inputEl.value.trim() || '-') : null);
    } else {
      resolver(Boolean(confirmed));
    }
  }

  function handlePopupBackdropClick(e) {
    if (e.target && e.target.id === 'pmiCustomPopupOverlay') {
      resolveCustomPopup(false);
    }
  }

  function handlePopupInputKeydown(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      resolveCustomPopup(true);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      resolveCustomPopup(false);
    }
  }

  document.addEventListener('keydown', function(e) {
    var overlay = document.getElementById('pmiCustomPopupOverlay');
    if (overlay && overlay.classList.contains('show') && e.key === 'Escape') {
      resolveCustomPopup(false);
    }
  });

  function showToast(message, type) {
    var container = document.getElementById('toastContainer');
    var bgClass = type === 'danger' ? 'bg-danger text-white' : (type === 'warning' ? 'bg-warning text-dark' : 'bg-dark text-white');
    var icon = type === 'danger' ? 'bi-exclamation-octagon-fill' : (type === 'warning' ? 'bi-exclamation-triangle-fill' : 'bi-check-circle-fill text-success');

    var wrapper = document.createElement('div');
    wrapper.className = 'toast align-items-center border-0 show shadow rounded-3 mb-2 ' + bgClass;
    wrapper.setAttribute('role', 'alert');
    wrapper.innerHTML =
      '<div class="d-flex">' +
        '<div class="toast-body d-flex align-items-center gap-2">' +
          '<i class="bi ' + icon + ' fs-5"></i>' +
          '<span>' + escapeHtml(message) + '</span>' +
        '</div>' +
        '<button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.closest(\'.toast\').remove()"></button>' +
      '</div>';
    container.appendChild(wrapper);
    setTimeout(function() {
      if (wrapper && wrapper.parentNode) wrapper.remove();
    }, 4500);
  }

  /* ==========================================================================
   * 3. AUTENTIKASI LOGIN & HAK AKSES (RBAC)
   * ========================================================================== */
  function fillDemoLogin(user, pass) {
    document.getElementById('loginUsername').value = user;
    document.getElementById('loginPassword').value = pass;
  }

  function togglePasswordVisibility() {
    var input = document.getElementById('loginPassword');
    var icon = document.getElementById('togglePassIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'bi bi-eye';
    }
  }

  function handleLoginSubmit(e) {
    e.preventDefault();
    var username = document.getElementById('loginUsername').value.trim();
    var password = document.getElementById('loginPassword').value;
    var errBox = document.getElementById('loginErrorBox');
    errBox.classList.add('d-none');

    callServerApi('LOGIN', { username: username, password: password }, { loadingTitle: 'Autentikasi Pengguna...' })
      .then(function(res) {
        APP_STATE.token = res.data.token;
        APP_STATE.user = res.data.user;
        APP_STATE.permissions = res.data.permissions || {};
        localStorage.setItem('PMI_SKA_SESSION_TOKEN', APP_STATE.token);
        enterAuthenticatedApp();
        showToast(res.message || 'Login berhasil!', 'success');
      })
      .catch(function(err) {
        errBox.textContent = err.message || 'Username atau password salah.';
        errBox.classList.remove('d-none');
      });
  }

  function verifyExistingSession() {
    syncInitialBundleSilently().catch(function() {
      handleForceLogout();
    });
  }

  function enterAuthenticatedApp(skipNetworkFetch) {
    document.getElementById('authScreen').classList.add('d-none');
    document.getElementById('appShell').classList.remove('d-none');

    var u = APP_STATE.user || {};
    document.getElementById('headerUserName').textContent = u.nama_lengkap || u.username || 'User';
    document.getElementById('headerUserRole').textContent = u.role || 'PETUGAS';
    document.getElementById('headerUserAvatar').textContent = String(u.nama_lengkap || 'U').charAt(0).toUpperCase();
    document.getElementById('outPenanggungJawab').value = u.nama_lengkap || '';
    document.getElementById('soPetugasPemeriksa').value = u.nama_lengkap || '';

    applyRolePermissionsToUI();
    renderAllCachedViewsInstantly();

    if (!skipNetworkFetch) {
      syncInitialBundleSilently();
    }
  }

  /**
   * Merender seluruh tampilan dari data di memori secara instan (0ms)
   * sehingga ketika pengguna berpindah menu sama sekali tidak ada jeda loading.
   */
  function renderAllCachedViewsInstantly() {
    if (APP_STATE.dashboardData) {
      applyDashboardDataToDOM(APP_STATE.dashboardData);
    }
    if (APP_STATE.masterBarang && APP_STATE.masterBarang.length > 0) {
      populateDonorDatalist();
      populateKartuStokDropdown();
      renderMasterBarangTable(APP_STATE.pagination.masterPage || 1);
    }
    if (APP_STATE.transaksiMasuk) {
      renderTransaksiMasukTable(APP_STATE.pagination.inPage || 1);
    }
    if (APP_STATE.transaksiKeluar) {
      renderTransaksiKeluarTable(APP_STATE.pagination.outPage || 1);
    }
    if (APP_STATE.stockOpnameList) {
      renderStockOpnameTable();
    }
    if (APP_STATE.expiredMonitoringList) {
      applyExpiredDataToDOM(APP_STATE.expiredSummary, APP_STATE.expiredMonitoringList);
    }
  }

  /**
   * Memuat seluruh data utama gudang dalam 1 kali eksekusi terpadu di background (tanpa loading overlay).
   */
  function syncInitialBundleSilently() {
    var startDate = document.getElementById('dashStartDate') ? document.getElementById('dashStartDate').value : '';
    var endDate = document.getElementById('dashEndDate') ? document.getElementById('dashEndDate').value : '';
    var year = document.getElementById('dashYearSelect') ? document.getElementById('dashYearSelect').value : '2026';

    return callServerApi('GET_INITIAL_BUNDLE', { startDate: startDate, endDate: endDate, year: year }, { silent: true })
      .then(function(res) {
        var b = res.data || {};
        if (b.user) APP_STATE.user = b.user;
        if (b.permissions) APP_STATE.permissions = b.permissions;
        if (b.settings) APP_STATE.settings = Object.assign(APP_STATE.settings, b.settings);

        if (b.masterData) {
          APP_STATE.masterBarang = b.masterData.items || [];
          APP_STATE.donors = b.masterData.donors || [];
        }
        if (b.dashboard) {
          APP_STATE.dashboardData = b.dashboard;
        }
        if (b.transaksiMasuk) {
          APP_STATE.transaksiMasuk = b.transaksiMasuk.transactions || [];
          APP_STATE.nextAutoNumberIn = b.transaksiMasuk.nextAutoNumber || APP_STATE.nextAutoNumberIn;
        }
        if (b.transaksiKeluar) {
          APP_STATE.transaksiKeluar = b.transaksiKeluar.transactions || [];
          APP_STATE.nextAutoNumberOut = b.transaksiKeluar.nextAutoNumber || APP_STATE.nextAutoNumberOut;
        }
        if (b.stockOpname) {
          APP_STATE.stockOpnameList = b.stockOpname.records || [];
          APP_STATE.nextAutoNumberOpname = b.stockOpname.nextAutoNumber || APP_STATE.nextAutoNumberOpname;
        }
        if (b.expiredMonitoring) {
          APP_STATE.expiredMonitoringList = b.expiredMonitoring.items || [];
          APP_STATE.expiredSummary = b.expiredMonitoring.summary || APP_STATE.expiredSummary;
        }

        APP_STATE.bundleLoaded = true;
        saveFastStateCache();

        document.getElementById('authScreen').classList.add('d-none');
        document.getElementById('appShell').classList.remove('d-none');
        var u = APP_STATE.user || {};
        document.getElementById('headerUserName').textContent = u.nama_lengkap || u.username || 'User';
        document.getElementById('headerUserRole').textContent = u.role || 'PETUGAS';
        document.getElementById('headerUserAvatar').textContent = String(u.nama_lengkap || 'U').charAt(0).toUpperCase();
        applyRolePermissionsToUI();
        renderAllCachedViewsInstantly();
        return b;
      });
  }

  function applyRolePermissionsToUI() {
    var p = APP_STATE.permissions || {};
    var role = APP_STATE.user ? APP_STATE.user.role : '';

    // Sembunyikan/tampilkan tombol aksi sesuai matriks role (validasi utama tetap di server)
    toggleElem('btnAddMasterBarang', p.canManageMasterBarang);
    toggleElem('btnImportMasterTrigger', p.canImportExcel);
    toggleElem('navItemMigrasi', p.canImportExcel);
    toggleElem('navItemPengaturan', p.canManageUsers);
    toggleElem('btnAddTrxMasuk', p.canInputTransaksiMasuk);
    toggleElem('btnAddTrxKeluar', p.canInputTransaksiKeluar);

  function handleLogout() {

      title: 'Keluar dari Sistem Gudang?',
      message: 'Sesi kerja Anda akan diakhiri. Anda dapat masuk kembali kapan saja menggunakan akun Anda.',
      detailHtml:
        '<div class="d-flex align-items-center gap-3">' +
          '<div class="user-avatar-circle flex-shrink-0">' + escapeHtml(String(u.nama_lengkap || 'U').charAt(0).toUpperCase()) + '</div>' +

  function handleForceLogout(msg) {
    APP_STATE.token = '';
    APP_STATE.user = null;
    localStorage.removeItem('PMI_SKA_SESSION_TOKEN');
    localStorage.removeItem(FAST_CACHE_KEY);
    document.getElementById('appShell').classList.add('d-none');
    document.getElementById('authScreen').classList.remove('d-none');
    document.getElementById('loginPassword').value = '';
    if (msg) showToast(msg, 'warning');

  /* ==========================================================================
   * 4. NAVIGASI ANTAR HALAMAN (SIDEBAR SWITCHER - INSTANT 0ms)
   * ========================================================================== */
  function switchView(viewName) {
    APP_STATE.activeView = viewName;

    var links = document.querySelectorAll('.nav-item-link[data-view]');
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('data-view') === viewName) {
        links[i].classList.add('active');
      } else {
        links[i].classList.remove('active');
      }
    }

    var sections = document.querySelectorAll('.view-section');
    for (var j = 0; j < sections.length; j++) {
      sections[j].classList.remove('active');
    }
    var target = document.getElementById('view-' + viewName);
    if (target) target.classList.add('active');

    var mainContent = document.getElementById('appMainContent');
    if (mainContent) mainContent.scrollTop = 0;

    // Tutup sidebar mobile jika sedang terbuka
    document.getElementById('appSidebar').classList.remove('mobile-open');

    // Tampilkan data secara instan dari memori dan sinkronkan secara silent di background
    if (viewName === 'dashboard') {
      if (APP_STATE.dashboardData) applyDashboardDataToDOM(APP_STATE.dashboardData);
      loadDashboardData(true);
    } else if (viewName === 'master-barang') {
      if (APP_STATE.masterBarang.length > 0) renderMasterBarangTable();
      loadMasterBarangData(true);
    } else if (viewName === 'transaksi-masuk') {
      if (APP_STATE.transaksiMasuk.length > 0) renderTransaksiMasukTable();
      loadTransaksiMasukData(true);
    } else if (viewName === 'transaksi-keluar') {
      if (APP_STATE.transaksiKeluar.length > 0) renderTransaksiKeluarTable();
      loadTransaksiKeluarData(true);
    } else if (viewName === 'kartu-stok') {
      populateKartuStokDropdown();
      if (document.getElementById('stockCardItemSelect').value) {
        loadKartuStokData();
      }
    } else if (viewName === 'stock-opname') {
      renderStockOpnameTable();
      loadStockOpnameData(true);
    } else if (viewName === 'expired') {
      if (APP_STATE.expiredMonitoringList.length > 0) {
        applyExpiredDataToDOM(APP_STATE.expiredSummary, APP_STATE.expiredMonitoringList);
      }
      loadExpiredMonitoringData(true);
    } else if (viewName === 'laporan') {
      generateSelectedReport();
    } else if (viewName === 'pengaturan') {
      loadUsersAndSettingsData();
    }
  }

  function toggleMobileSidebar() {
    document.getElementById('appSidebar').classList.toggle('mobile-open');
  }

  function handleGlobalSearchKey(e) {
    if (e.key === 'Enter') {

      if (!q) return;
      document.getElementById('filterMasterSearch').value = q;
      switchView('master-barang');

  function loadDashboardData() {
    var startDate = document.getElementById('dashStartDate').value;
    var endDate = document.getElementById('dashEndDate').value;
    var year = document.getElementById('dashYearSelect').value;
    document.getElementById('chartYearBadge').textContent = 'Tahun ' + year;

    callServerApi('GET_DASHBOARD', { startDate: startDate, endDate: endDate, year: year }, { silent: true })
      .then(function(res) {
        APP_STATE.dashboardData = res.data;
        saveFastStateCache();
        applyDashboardDataToDOM(res.data);
      });
  }

  function applyDashboardDataToDOM(d) {
    if (!d || !d.stats) return;
    var st = d.stats;

    document.getElementById('kpiTotalJenis').textContent = formatNumber(st.totalJenisBarang);
    document.getElementById('kpiTotalStok').textContent = formatNumber(st.totalStokKeseluruhan);
    document.getElementById('kpiTotalNilai').textContent = formatRupiah(st.totalNilaiPersediaan);
    document.getElementById('kpiStokMenipis').textContent = formatNumber(st.jumlahStokMenipis);
    document.getElementById('kpiTrxMasuk').textContent = formatNumber(st.jumlahTransaksiMasuk);
    document.getElementById('kpiUnitMasukSub').textContent = formatNumber(st.totalUnitMasukPeriode) + ' unit diterima';
    document.getElementById('kpiTrxKeluar').textContent = formatNumber(st.jumlahTransaksiKeluar);
    document.getElementById('kpiUnitKeluarSub').textContent = formatNumber(st.totalUnitKeluarPeriode) + ' unit terdistribusi';
    document.getElementById('kpiMendekatiExpired').textContent = formatNumber(st.jumlahMendekatiKedaluwarsa);
    document.getElementById('kpiSudahExpired').textContent = formatNumber(st.jumlahBarangKedaluwarsa);

    // Update badge notifikasi di sidebar dan topbar
    var totalAlert = (st.jumlahStokMenipis || 0) + (st.jumlahBarangKedaluwarsa || 0) + (st.jumlahMendekatiKedaluwarsa || 0);
    var notifDot = document.getElementById('topNotifCount');
    if (totalAlert > 0) {
      notifDot.textContent = totalAlert;
      notifDot.classList.remove('d-none');
    } else {
      notifDot.classList.add('d-none');
    }

    var expBadge = document.getElementById('sidebarExpiredBadge');
    var expCount = (st.jumlahBarangKedaluwarsa || 0) + (st.jumlahMendekatiKedaluwarsa || 0);
    if (expCount > 0) {
      expBadge.textContent = expCount;
      expBadge.classList.remove('d-none');
    } else {
      expBadge.classList.add('d-none');
    }

    var opnBadge = document.getElementById('sidebarOpnameBadge');
    if (st.pendingOpnameCount > 0) {
      opnBadge.textContent = st.pendingOpnameCount;
      opnBadge.classList.remove('d-none');
    } else {
      opnBadge.classList.add('d-none');
    }

    renderDashboardCharts(d.charts);
    renderDashboardLists(d.recentActivities, d.criticalStockList, d.nearExpiryList);
  }

  function renderDashboardLists(activities, criticalList, expiryList) {
    // 1. Tabel Aktivitas Transaksi Terbaru
    var actBody = document.getElementById('dashRecentActivityBody');
    if (!activities || activities.length === 0) {
      actBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Belum ada transaksi tercatat pada periode ini.</td></tr>';
    } else {
      var htmlAct = '';
      for (var i = 0; i < activities.length; i++) {
        var a = activities[i];
        var isMasuk = a.jenis === 'BARANG MASUK';
        var badgeJenis = isMasuk
          ? '<span class="badge-pmi badge-aman"><i class="bi bi-arrow-down-left"></i> MASUK</span>'
          : '<span class="badge-pmi badge-expired"><i class="bi bi-arrow-up-right"></i> KELUAR</span>';
        htmlAct +=
          '<tr>' +
            '<td class="fw-bold">' + escapeHtml(a.no_transaksi) + '<div class="small text-muted">' + escapeHtml(a.dokumen_ref) + '</div></td>' +
            '<td>' + escapeHtml(a.tanggal) + '</td>' +
            '<td><div class="fw-bold">' + escapeHtml(a.nama_barang) + '</div><div class="small text-muted">' + escapeHtml(a.kode_barang) + ' &bull; ' + escapeHtml(a.kategori) + '</div></td>' +
            '<td>' + badgeJenis + '</td>' +
            '<td class="text-end fw-bolder ' + (isMasuk ? 'text-success' : 'text-danger') + '">' + (isMasuk ? '+' : '-') + formatNumber(a.jumlah) + ' ' + escapeHtml(a.satuan) + '</td>' +
            '<td class="small">' + escapeHtml(a.mitra_tujuan) + '</td>' +
          '</tr>';
      }
      actBody.innerHTML = htmlAct;
    }

    // 2. Tabel Daftar Stok Kritis
    var critBody = document.getElementById('dashCriticalStockBody');
    if (!criticalList || criticalList.length === 0) {
      critBody.innerHTML = '<tr><td colspan="5" class="text-center text-success py-3"><i class="bi bi-check-circle me-1"></i> Seluruh stok barang berada di atas batas minimum.</td></tr>';
    } else {
      var htmlCrit = '';
      for (var c = 0; c < criticalList.length; c++) {
        var cr = criticalList[c];
        var stBadge = cr.saldo_stok <= 0
          ? '<span class="badge-pmi badge-expired">HABIS</span>'
          : '<span class="badge-pmi badge-perhatian">MENIPIS</span>';
        htmlCrit +=
          '<tr>' +
            '<td><div class="fw-bold">' + escapeHtml(cr.nama_barang) + '</div><div class="small text-muted">' + escapeHtml(cr.kode_barang) + '</div></td>' +
            '<td>' + renderCategoryBadge(cr.kategori) + '</td>' +
            '<td class="text-end fw-bolder text-danger">' + formatNumber(cr.saldo_stok) + ' ' + escapeHtml(cr.satuan) + '</td>' +
            '<td class="text-end text-muted">' + formatNumber(cr.stok_minimum) + '</td>' +
            '<td>' + stBadge + '</td>' +
          '</tr>';
      }
      critBody.innerHTML = htmlCrit;
    }

    // 3. Tabel Daftar Mendekati / Sudah Kedaluwarsa
    var expBody = document.getElementById('dashNearExpiryBody');
    if (!expiryList || expiryList.length === 0) {
      expBody.innerHTML = '<tr><td colspan="4" class="text-center text-success py-3"><i class="bi bi-shield-check me-1"></i> Tidak ada barang yang mendekati kedaluwarsa.</td></tr>';
    } else {
      var htmlExp = '';
      for (var x = 0; x < expiryList.length; x++) {
        var ex = expiryList[x];
        htmlExp +=
          '<tr>' +
            '<td><div class="fw-bold">' + escapeHtml(ex.nama_barang) + '</div><div class="small text-muted">' + escapeHtml(ex.kode_barang) + '</div></td>' +
            '<td><div class="fw-bold">' + escapeHtml(ex.expired_date) + '</div><div class="small text-muted">' + ex.days_remaining + ' hari</div></td>' +
            '<td class="text-end fw-bold">' + formatNumber(ex.saldo_stok) + ' ' + escapeHtml(ex.satuan) + '</td>' +
            '<td>' + renderExpiryBadge(ex.status_expired) + '</td>' +
          '</tr>';
      }
      expBody.innerHTML = htmlExp;
    }
  }

  function loadMasterBarangData(silent) {
    callServerApi('GET_MASTER_BARANG', {}, { silent: true })
      .then(function(res) {
        APP_STATE.masterBarang = res.data.items || [];
        APP_STATE.donors = res.data.donors || [];
        saveFastStateCache();
        populateDonorDatalist();
        populateKartuStokDropdown();
        renderMasterBarangTable(APP_STATE.pagination.masterPage || 1);
      });

  function populateDonorDatalist() {
    var dl = document.getElementById('donorDatalist');
    var html = '';
    for (var i = 0; i < APP_STATE.donors.length; i++) {
      var d = APP_STATE.donors[i];
      html += '<option value="' + escapeHtml(d.kode_donor) + '">' + escapeHtml(d.nama_donor) + '</option>';
    }
    dl.innerHTML = html;
  }

  function getFilteredMasterBarang() {
    var q = (document.getElementById('filterMasterSearch').value || '').trim().toLowerCase();
    var kat = document.getElementById('filterMasterKategori').value || 'SEMUA';
    var st = document.getElementById('filterMasterStatus').value || 'SEMUA';

    return APP_STATE.masterBarang.filter(function(item) {
      if (kat !== 'SEMUA' && item.kategori !== kat) return false;
      if (st !== 'SEMUA' && item.status_aktif !== st) return false;
      if (q) {
        var hay = (item.kode_barang + ' ' + item.nama_barang + ' ' + item.subkategori + ' ' + item.sumber_donor + ' ' + item.lokasi_rak).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function renderMasterBarangTable(page) {
    if (page) APP_STATE.pagination.masterPage = page;
    var filtered = getFilteredMasterBarang();
    var pageSize = APP_STATE.pagination.pageSize;
    var currentPage = APP_STATE.pagination.masterPage;
    var totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;

    var startIdx = (currentPage - 1) * pageSize;
    var pageItems = filtered.slice(startIdx, startIdx + pageSize);

    var tbody = document.getElementById('masterBarangTableBody');
    var canEdit = APP_STATE.permissions.canManageMasterBarang;

    if (pageItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="14" class="text-center text-muted py-4">Tidak ada data barang yang sesuai dengan filter.</td></tr>';
    } else {
      var html = '';
      for (var i = 0; i < pageItems.length; i++) {
        var it = pageItems[i];
        var stokBadge = it.status_stok === 'HABIS'
          ? '<span class="badge-pmi badge-expired">HABIS</span>'
          : (it.status_stok === 'MENIPIS' ? '<span class="badge-pmi badge-perhatian">MENIPIS</span>' : '<span class="badge-pmi badge-aman">TERSEDIA</span>');

        var actionBtns =
          '<div class="btn-group btn-group-sm">' +
            '<button class="btn btn-light border" title="Lihat Kartu Stok" onclick="openKartuStokForItem(\'' + it.id_barang + '\')"><i class="bi bi-card-checklist text-primary"></i></button>';

        if (canEdit) {
          actionBtns +=
            '<button class="btn btn-light border" title="Edit Barang" onclick="openMasterBarangModal(\'' + it.id_barang + '\')"><i class="bi bi-pencil-square text-dark"></i></button>' +
            '<button class="btn btn-light border" title="Hapus Barang" onclick="handleDeleteMasterBarang(\'' + it.id_barang + '\')"><i class="bi bi-trash text-danger"></i></button>';
        }
        actionBtns += '</div>';

        html +=
          '<tr>' +
            '<td class="fw-bolder text-danger">' + escapeHtml(it.kode_barang) + '</td>' +
            '<td>' +
              '<div class="fw-bold">' + escapeHtml(it.nama_barang) + '</div>' +
              (it.nearest_expired_date ? '<div class="small text-muted"><i class="bi bi-calendar-event me-1"></i>Exp: ' + escapeHtml(it.nearest_expired_date) + '</div>' : '') +
            '</td>' +
            '<td>' + renderCategoryBadge(it.kategori) + '<div class="small text-muted mt-1">' + escapeHtml(it.subkategori) + '</div></td>' +
            '<td>' + escapeHtml(it.satuan) + '</td>' +
            '<td class="text-end">' + formatRupiah(it.harga_unit) + '</td>' +
            '<td><span class="badge bg-light text-dark border">' + escapeHtml(it.sumber_donor) + '</span></td>' +
            '<td class="text-end text-muted">' + formatNumber(it.stok_minimum) + '</td>' +
            '<td class="text-end text-success">+' + formatNumber(it.total_masuk) + '</td>' +
            '<td class="text-end text-danger">-' + formatNumber(it.total_keluar) + '</td>' +
            '<td class="text-end fw-bolder fs-6">' + formatNumber(it.saldo_stok) + '</td>' +
            '<td class="text-end fw-bold">' + formatRupiah(it.total_nilai) + '</td>' +
            '<td>' + escapeHtml(it.lokasi_rak) + '</td>' +
            '<td>' + stokBadge + '</td>' +
            '<td class="text-center">' + actionBtns + '</td>' +
          '</tr>';
      }
      tbody.innerHTML = html;
    }

    document.getElementById('masterBarangPageInfo').textContent =
      'Menampilkan ' + (filtered.length > 0 ? (startIdx + 1) : 0) + ' - ' + Math.min(startIdx + pageSize, filtered.length) + ' dari ' + filtered.length + ' barang';
    renderPaginationControls('masterBarangPagination', currentPage, totalPages, 'renderMasterBarangTable');
  }

  function handleMasterCategoryChange() {
    var kat = document.getElementById('mbKategori').value;
    document.getElementById('mbHasExpiry').value = (kat === 'NON FOOD') ? 'TIDAK' : 'YA';
  }

  function openMasterBarangModal(idBarang) {
    var form = document.getElementById('formMasterBarang');
    form.reset();
    document.getElementById('mbIdBarang').value = '';

    if (idBarang) {
      var item = APP_STATE.masterBarang.find(function(x) { return x.id_barang === idBarang; });
      if (!item) return;
      document.getElementById('modalMasterBarangTitle').innerHTML = '<i class="bi bi-pencil-square me-2"></i>Edit Master Barang (' + escapeHtml(item.kode_barang) + ')';
      document.getElementById('mbIdBarang').value = item.id_barang;
      document.getElementById('mbKategori').value = item.kategori;
      document.getElementById('mbKodeBarang').value = item.kode_barang;
      document.getElementById('mbSubkategori').value = item.subkategori === '-' ? '' : item.subkategori;
      document.getElementById('mbNamaBarang').value = item.nama_barang;
      document.getElementById('mbSatuan').value = item.satuan;
      document.getElementById('mbHargaUnit').value = item.harga_unit;
      document.getElementById('mbSumberDonor').value = item.sumber_donor === '-' ? '' : item.sumber_donor;
      document.getElementById('mbStokMinimum').value = item.stok_minimum;
      document.getElementById('mbLokasiRak').value = item.lokasi_rak === '-' ? '' : item.lokasi_rak;
      document.getElementById('mbHasExpiry').value = item.has_expiry || 'TIDAK';
      document.getElementById('mbStatusAktif').value = item.status_aktif || 'AKTIF';
      document.getElementById('mbKeterangan').value = item.keterangan || '';
      document.getElementById('mbInitialStockRow').classList.add('d-none');
    } else {
      document.getElementById('modalMasterBarangTitle').innerHTML = '<i class="bi bi-plus-circle me-2"></i>Tambah Master Barang Baru';
      document.getElementById('mbInitialStockRow').classList.remove('d-none');
      handleMasterCategoryChange();
    }

    new bootstrap.Modal(document.getElementById('modalMasterBarang')).show();
  }

  function handleSaveMasterBarang(e) {
    e.preventDefault();
    var payload = {
      id_barang: document.getElementById('mbIdBarang').value,
      kategori: document.getElementById('mbKategori').value,
      kode_barang: document.getElementById('mbKodeBarang').value.trim(),
      subkategori: document.getElementById('mbSubkategori').value.trim(),
      nama_barang: document.getElementById('mbNamaBarang').value.trim(),
      satuan: document.getElementById('mbSatuan').value.trim(),
      harga_unit: document.getElementById('mbHargaUnit').value,
      sumber_donor: document.getElementById('mbSumberDonor').value.trim(),

  function loadTransaksiMasukData() {
    var startDate = document.getElementById('filterInStartDate').value;
    var endDate = document.getElementById('filterInEndDate').value;
    callServerApi('GET_TRANSAKSI_MASUK', { startDate: startDate, endDate: endDate }, { silent: true })
      .then(function(res) {
        APP_STATE.transaksiMasuk = res.data.transactions || [];
        APP_STATE.nextAutoNumberIn = res.data.nextAutoNumber || 'BM-AUTO';
        saveFastStateCache();
        renderTransaksiMasukTable(APP_STATE.pagination.inPage || 1);
      });
  }

  function resetFilterTransaksiMasuk() {
    document.getElementById('filterInSearch').value = '';
    document.getElementById('filterInKategori').value = 'SEMUA';
    document.getElementById('filterInStartDate').value = '';
    document.getElementById('filterInEndDate').value = '';
    loadTransaksiMasukData();
  }

  function renderTransaksiMasukTable(page) {
    if (page) APP_STATE.pagination.inPage = page;
    var q = (document.getElementById('filterInSearch').value || '').trim().toLowerCase();
    var kat = document.getElementById('filterInKategori').value || 'SEMUA';

    var filtered = APP_STATE.transaksiMasuk.filter(function(r) {
      if (kat !== 'SEMUA' && r.kategori !== kat) return false;
      if (q) {
        var hay = (r.no_transaksi + ' ' + r.kode_barang + ' ' + r.nama_barang + ' ' + r.no_grn + ' ' + r.sumber_donor + ' ' + r.catatan).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    var pageSize = APP_STATE.pagination.pageSize;
    var currentPage = APP_STATE.pagination.inPage;
    var totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;
    var startIdx = (currentPage - 1) * pageSize;
    var pageItems = filtered.slice(startIdx, startIdx + pageSize);

    var tbody = document.getElementById('transaksiMasukTableBody');
    var canEdit = APP_STATE.permissions.canEditTransaksiMasuk;

    if (pageItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="12" class="text-center text-muted py-4">Tidak ada data transaksi barang masuk.</td></tr>';
    } else {
      var html = '';
      for (var i = 0; i < pageItems.length; i++) {
        var r = pageItems[i];
        var docLink = r.dokumen_url
          ? '<a href="' + escapeHtml(r.dokumen_url) + '" target="_blank" class="badge bg-primary text-decoration-none"><i class="bi bi-paperclip"></i> Dokumen</a>'
          : '<span class="text-muted small">-</span>';

        var btns =
          '<div class="btn-group btn-group-sm">' +
            '<button class="btn btn-light border" title="Cetak Bukti Barang Masuk (GRN)" onclick="printBuktiTransaksi(\'MASUK\', \'' + r.id_masuk + '\')"><i class="bi bi-printer-fill text-dark"></i></button>';
        if (canEdit) {
          btns +=
            '<button class="btn btn-light border" title="Edit Transaksi (Admin)" onclick="openTransaksiMasukModal(\'' + r.id_masuk + '\')"><i class="bi bi-pencil-square text-primary"></i></button>' +
            '<button class="btn btn-light border" title="Hapus Transaksi (Admin)" onclick="handleDeleteTransaksiMasuk(\'' + r.id_masuk + '\')"><i class="bi bi-trash text-danger"></i></button>';
        }
        btns += '</div>';

        html +=
          '<tr>' +
            '<td class="fw-bolder text-success">' + escapeHtml(r.no_transaksi) + '</td>' +
            '<td>' + escapeHtml(r.tanggal) + '</td>' +
            '<td><div class="fw-bold">' + escapeHtml(r.no_grn) + '</div><div class="small text-muted">Req: ' + escapeHtml(r.no_request) + '</div></td>' +
            '<td><div class="fw-bold">' + escapeHtml(r.nama_barang) + '</div><div class="small text-danger fw-bold">' + escapeHtml(r.kode_barang) + '</div></td>' +
            '<td>' + renderCategoryBadge(r.kategori) + '</td>' +
            '<td class="text-end fw-bolder text-success">+' + formatNumber(r.jumlah_masuk) + ' ' + escapeHtml(r.satuan) + '</td>' +
            '<td class="text-end">' + formatRupiah(r.harga_unit) + '</td>' +
            '<td class="text-end fw-bold">' + formatRupiah(r.total_nilai) + '</td>' +
            '<td>' + escapeHtml(r.sumber_donor) + '</td>' +
            '<td>' + (r.expired_date ? escapeHtml(r.expired_date) : '-') + '</td>' +
            '<td>' + docLink + '</td>' +
            '<td class="text-center">' + btns + '</td>' +
          '</tr>';
      }
      tbody.innerHTML = html;
    }

    document.getElementById('trxMasukPageInfo').textContent =
      'Menampilkan ' + (filtered.length > 0 ? (startIdx + 1) : 0) + ' - ' + Math.min(startIdx + pageSize, filtered.length) + ' dari ' + filtered.length + ' transaksi masuk';
    renderPaginationControls('trxMasukPagination', currentPage, totalPages, 'renderTransaksiMasukTable');
  }

  function populateTransaksiItemDropdown(mode, selectedId) {
    var filterSelect = document.getElementById(mode === 'in' ? 'inFilterKategori' : 'outFilterKategori');
    var itemSelect = document.getElementById(mode === 'in' ? 'inIdBarang' : 'outIdBarang');
    var kat = filterSelect.value || 'SEMUA';

    var html = '<option value="">-- Pilih Barang --</option>';
    for (var i = 0; i < APP_STATE.masterBarang.length; i++) {
      var it = APP_STATE.masterBarang[i];
      if (it.status_aktif !== 'AKTIF' && it.id_barang !== selectedId) continue;
      if (kat !== 'SEMUA' && it.kategori !== kat) continue;
      var sel = (it.id_barang === selectedId) ? ' selected' : '';
      html += '<option value="' + it.id_barang + '"' + sel + '>[' + escapeHtml(it.kode_barang) + '] ' + escapeHtml(it.nama_barang) + ' (Stok: ' + formatNumber(it.saldo_stok) + ' ' + escapeHtml(it.satuan) + ')</option>';
    }
    itemSelect.innerHTML = html;
  }

  function openTransaksiMasukModal(idMasuk) {
    var form = document.getElementById('formTransaksiMasuk');
    form.reset();
    document.getElementById('inIdMasuk').value = '';
    document.getElementById('inFilterKategori').value = 'SEMUA';
    document.getElementById('inTanggal').value = new Date().toISOString().substring(0, 10);

    if (idMasuk) {
      var tx = APP_STATE.transaksiMasuk.find(function(x) { return x.id_masuk === idMasuk; });
      if (!tx) return;
      document.getElementById('modalTrxMasukTitle').innerHTML = '<i class="bi bi-pencil-square me-2"></i>Edit Transaksi Barang Masuk (' + escapeHtml(tx.no_transaksi) + ')';
      document.getElementById('inIdMasuk').value = tx.id_masuk;
      document.getElementById('inNoTransaksi').value = tx.no_transaksi;
      document.getElementById('inTanggal').value = tx.tanggal;
      populateTransaksiItemDropdown('in', tx.id_barang);
      handleSelectBarangMasukChange();
      document.getElementById('inJumlahMasuk').value = tx.jumlah_masuk;
      document.getElementById('inHargaUnit').value = tx.harga_unit;
      calculateTotalNilaiMasuk();
      document.getElementById('inSumberDonor').value = tx.sumber_donor;
      document.getElementById('inNoGrn').value = tx.no_grn === '-' ? '' : tx.no_grn;
      document.getElementById('inNoRequest').value = tx.no_request === '-' ? '' : tx.no_request;
      document.getElementById('inExpiredDate').value = tx.expired_date || '';
      document.getElementById('inCatatan').value = tx.catatan || '';
    } else {
      document.getElementById('modalTrxMasukTitle').innerHTML = '<i class="bi bi-box-arrow-in-down-left me-2"></i>Input Transaksi Barang Masuk (GRN)';
      document.getElementById('inNoTransaksi').value = APP_STATE.nextAutoNumberIn;
      populateTransaksiItemDropdown('in');
      document.getElementById('inTotalNilaiDisplay').value = 'Rp 0';
    }

    new bootstrap.Modal(document.getElementById('modalTransaksiMasuk')).show();

  function handleSelectBarangMasukChange() {
    var idB = document.getElementById('inIdBarang').value;
    var item = APP_STATE.masterBarang.find(function(x) { return x.id_barang === idB; });
    if (!item) {
      document.getElementById('inKodeSatuanDisplay').value = '-';
      return;
    }
    document.getElementById('inKodeSatuanDisplay').value = item.kode_barang + ' (' + item.satuan + ')';
    document.getElementById('inHargaUnit').value = item.harga_unit || 0;
    if (!document.getElementById('inSumberDonor').value && item.sumber_donor && item.sumber_donor !== '-') {
      document.getElementById('inSumberDonor').value = item.sumber_donor;
    }
    calculateTotalNilaiMasuk();
  }

  function calculateTotalNilaiMasuk() {
    var q = parseFloat(document.getElementById('inJumlahMasuk').value) || 0;
    var p = parseFloat(document.getElementById('inHargaUnit').value) || 0;
    document.getElementById('inTotalNilaiDisplay').value = formatRupiah(q * p);
  }

  function handleSaveTransaksiMasuk(e) {
    e.preventDefault();
    var fileInput = document.getElementById('inDokumenFile');
    var payload = {
      id_masuk: document.getElementById('inIdMasuk').value,
      tanggal: document.getElementById('inTanggal').value,
      id_barang: document.getElementById('inIdBarang').value,
      jumlah_masuk: document.getElementById('inJumlahMasuk').value,
      harga_unit: document.getElementById('inHargaUnit').value,
      sumber_donor: document.getElementById('inSumberDonor').value.trim(),
      no_grn: document.getElementById('inNoGrn').value.trim(),
      no_request: document.getElementById('inNoRequest').value.trim(),
      expired_date: document.getElementById('inExpiredDate').value,
      catatan: document.getElementById('inCatatan').value.trim()
    };

    readFileAsBase64(fileInput).then(function(fileObj) {
      if (fileObj) {
        payload.dokumen_base64 = fileObj.base64;
        payload.dokumen_name = fileObj.name;
        payload.dokumen_mime = fileObj.mime;
      }
      return callServerApi('SAVE_TRANSAKSI_MASUK', payload, { loadingTitle: 'Menyimpan Transaksi Barang Masuk...' });
    }).then(function(res) {
      bootstrap.Modal.getInstance(document.getElementById('modalTransaksiMasuk')).hide();
      showToast(res.message, 'success');
      loadMasterBarangData(true);
      loadTransaksiMasukData();
    });
  }

  function handleDeleteTransaksiMasuk(idMasuk) {
    var tx = APP_STATE.transaksiMasuk.find(function(x) { return x.id_masuk === idMasuk; });
    if (!tx) return;

    showCustomPopup({

      message: 'Saldo stok gudang akan dikurangi kembali sejumlah barang pada transaksi ini.',
      detailHtml:

        '<div class="fw-bold text-dark">' + escapeHtml(tx.nama_barang) + ' &mdash; <span class="text-success">+' + formatNumber(tx.jumlah_masuk) + ' ' + escapeHtml(tx.satuan) + '</span></div>',
      inputLabel: 'ALASAN PENGHAPUSAN (WAJIB DICATAT DI LOG AUDIT)',
      defaultValue: 'Koreksi input oleh Admin',
      cancelText: 'Batal',

    }).then(function(alasan) {
      if (alasan === null) return;
      callServerApi('DELETE_TRANSAKSI_MASUK', { id_masuk: idMasuk, alasan: alasan })

          showToast(res.message, 'success');
          loadMasterBarangData(true);

          loadDashboardData(true);

  function handleSelectBarangKeluarChange() {
    var idB = document.getElementById('outIdBarang').value;
    var item = APP_STATE.masterBarang.find(function(x) { return x.id_barang === idB; });
    if (!item) {
      document.getElementById('outStokTersediaDisplay').value = '0 Unit';
      return;
    }
    var available = Number(item.saldo_stok) || 0;
    var editId = document.getElementById('outIdKeluar').value;
    if (editId) {
      var oldTx = APP_STATE.transaksiKeluar.find(function(x) { return x.id_keluar === editId; });
      if (oldTx && oldTx.id_barang === idB) {
        available += Number(oldTx.jumlah_keluar) || 0;
      }
    }
    document.getElementById('outStokTersediaDisplay').value = formatNumber(available) + ' ' + item.satuan;
    document.getElementById('outStokTersediaDisplay').setAttribute('data-max-stock', available);
    validateOutQtyAgainstStock();
  }

  function validateOutQtyAgainstStock() {
    var maxStock = parseFloat(document.getElementById('outStokTersediaDisplay').getAttribute('data-max-stock') || '0');
    var qty = parseFloat(document.getElementById('outJumlahKeluar').value || '0');
    var warnEl = document.getElementById('outStockWarningText');
    var btnSubmit = document.getElementById('btnSubmitTrxKeluar');

    if (qty > maxStock) {
      warnEl.classList.remove('d-none');
      btnSubmit.disabled = true;
    } else {
      warnEl.classList.add('d-none');
      btnSubmit.disabled = false;
    }
  }

  function handleSaveTransaksiKeluar(e) {
    e.preventDefault();
    var maxStock = parseFloat(document.getElementById('outStokTersediaDisplay').getAttribute('data-max-stock') || '0');
    var qty = parseFloat(document.getElementById('outJumlahKeluar').value || '0');

    if (qty > maxStock) {
      showToast('TRANSAKSI DITOLAK: Jumlah barang keluar (' + qty + ') melebihi saldo stok tersedia (' + maxStock + ').', 'danger');
      return;
    }

    var fileInput = document.getElementById('outDokumenFile');
    var payload = {
      id_keluar: document.getElementById('outIdKeluar').value,
      tanggal: document.getElementById('outTanggal').value,
      id_barang: document.getElementById('outIdBarang').value,
      jumlah_keluar: qty,
      tujuan_distribusi: document.getElementById('outTujuanDistribusi').value.trim(),
      nama_penerima: document.getElementById('outNamaPenerima').value.trim(),
      no_gdn: document.getElementById('outNoGdn').value.trim(),
      no_request: document.getElementById('outNoRequest').value.trim(),
      penanggung_jawab: document.getElementById('outPenanggungJawab').value.trim(),
      catatan: document.getElementById('outCatatan').value.trim()
    };

    readFileAsBase64(fileInput).then(function(fileObj) {
      if (fileObj) {
        payload.dokumen_base64 = fileObj.base64;
        payload.dokumen_name = fileObj.name;
        payload.dokumen_mime = fileObj.mime;
      }
      return callServerApi('SAVE_TRANSAKSI_KELUAR', payload, { loadingTitle: 'Memvalidasi Stok & Menyimpan Barang Keluar...' });
    }).then(function(res) {
      bootstrap.Modal.getInstance(document.getElementById('modalTransaksiKeluar')).hide();
      showToast(res.message, 'success');
      loadMasterBarangData(true);
      loadTransaksiKeluarData();
    });
  }

  function handleDeleteTransaksiKeluar(idKeluar) {
    var tx = APP_STATE.transaksiKeluar.find(function(x) { return x.id_keluar === idKeluar; });
    if (!tx) return;

    showCustomPopup({
      mode: 'prompt',
      variant: 'danger',
      icon: 'bi-trash3-fill',
      title: 'Hapus Transaksi Barang Keluar?',
      message: 'Stok barang yang dikeluarkan akan dikembalikan ke saldo tersedia di gudang.',
      detailHtml:
        '<div class="fw-bolder text-danger">' + escapeHtml(tx.no_transaksi) + ' (' + escapeHtml(tx.no_gdn || '-') + ')</div>' +
        '<div class="fw-bold text-dark">' + escapeHtml(tx.nama_barang) + ' &mdash; <span class="text-danger">-' + formatNumber(tx.jumlah_keluar) + ' ' + escapeHtml(tx.satuan) + '</span></div>' +
        '<div class="small text-muted">Tujuan: ' + escapeHtml(tx.tujuan_distribusi) + '</div>',
      inputLabel: 'ALASAN PEMBATALAN / PENGHAPUSAN',
      defaultValue: 'Pembatalan distribusi',
      cancelText: 'Batal',
      confirmText: 'Hapus Transaksi',
      confirmIcon: 'bi-trash3'
    }).then(function(alasan) {
      if (alasan === null) return;
      callServerApi('DELETE_TRANSAKSI_KELUAR', { id_keluar: idKeluar, alasan: alasan })
        .then(function(res) {
          showToast(res.message, 'success');
          loadMasterBarangData(true);
          loadTransaksiKeluarData();
          loadDashboardData(true);
        });
    });
  }

  function populateKartuStokDropdown() {
    var select = document.getElementById('stockCardItemSelect');
    var currentVal = select.value;
    var html = '<option value="">-- Pilih Barang untuk Menampilkan Kartu Stok --</option>';
    for (var i = 0; i < APP_STATE.masterBarang.length; i++) {
      var it = APP_STATE.masterBarang[i];
      var sel = (it.id_barang === currentVal) ? ' selected' : '';
      html += '<option value="' + it.id_barang + '"' + sel + '>[' + escapeHtml(it.kode_barang) + '] ' + escapeHtml(it.nama_barang) + ' - ' + escapeHtml(it.kategori) + ' (Saldo: ' + formatNumber(it.saldo_stok) + ' ' + escapeHtml(it.satuan) + ')</option>';
    }
    select.innerHTML = html;
  }

  function openKartuStokForItem(idBarang) {
    switchView('kartu-stok');
    populateKartuStokDropdown();
    document.getElementById('stockCardItemSelect').value = idBarang;
    loadKartuStokData();
  }

  function loadKartuStokData() {
    var idBarang = document.getElementById('stockCardItemSelect').value;
    if (!idBarang) {
      showToast('Silakan pilih barang terlebih dahulu.', 'warning');
      return;
    }
    var startDate = document.getElementById('stockCardStartDate').value;
    var endDate = document.getElementById('stockCardEndDate').value;

    callServerApi('GET_KARTU_STOK', { id_barang: idBarang, startDate: startDate, endDate: endDate }, { loadingTitle: 'Menyusun Kartu Stok Kronologis...' })
      .then(function(res) {
        APP_STATE.activeKartuStok = res.data;
        renderKartuStokView(res.data);
      });
  }

  function renderKartuStokView(data) {
    var it = data.item;
    var sum = data.summary;
    var ledger = data.ledger || [];

    document.getElementById('scHeaderNama').textContent = it.nama_barang;
    document.getElementById('scHeaderKode').textContent = it.kode_barang + ' | Sumber: ' + it.sumber_donor;
    document.getElementById('scHeaderKategori').textContent = it.kategori;
    document.getElementById('scHeaderSatuan').textContent = 'Satuan: ' + it.satuan;
    document.getElementById('scHeaderHarga').textContent = formatRupiah(it.harga_unit);
    document.getElementById('scHeaderRak').textContent = 'Rak: ' + it.lokasi_rak;
    document.getElementById('scHeaderMutasi').textContent = '+' + formatNumber(sum.totalMasukPeriode) + ' / -' + formatNumber(sum.totalKeluarPeriode);
    document.getElementById('scHeaderPeriode').textContent = sum.startDate + ' s/d ' + sum.endDate;
    document.getElementById('scHeaderSaldoAkhir').textContent = formatNumber(sum.saldoAkhirPeriode) + ' ' + it.satuan;
    document.getElementById('scHeaderNilaiAkhir').textContent = formatRupiah(sum.nilaiPersediaanAkhir);

    var tbody = document.getElementById('kartuStokTableBody');
    if (ledger.length === 0) {
      tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted py-4">Tidak ada riwayat mutasi pada periode ini.</td></tr>';
      return;
    }

    var html = '';
    for (var i = 0; i < ledger.length; i++) {
      var row = ledger[i];
      html +=
        '<tr>' +
          '<td>' + (i + 1) + '</td>' +
          '<td>' + escapeHtml(row.tanggal) + '</td>' +
          '<td class="fw-bold">' + escapeHtml(row.no_dokumen) + '</td>' +
          '<td>' + escapeHtml(row.keterangan) + '</td>' +
          '<td class="text-end fw-bold text-success">' + (row.barang_masuk > 0 ? '+' + formatNumber(row.barang_masuk) : '-') + '</td>' +
          '<td class="text-end fw-bold text-danger">' + (row.barang_keluar > 0 ? '-' + formatNumber(row.barang_keluar) : '-') + '</td>' +
          '<td class="text-end fw-bolder bg-light">' + formatNumber(row.saldo_stok) + '</td>' +
          '<td class="text-end">' + formatRupiah(row.harga_satuan) + '</td>' +
          '<td class="text-end fw-bold">' + formatRupiah(row.nilai_persediaan) + '</td>' +
          '<td>' + escapeHtml(row.sumber_barang) + '</td>' +
          '<td>' + escapeHtml(row.tujuan_distribusi) + '</td>' +
        '</tr>';
    }
    tbody.innerHTML = html;
  }

  function loadStockOpnameData() {
    var kat = document.getElementById('filterOpnameKategori').value;
    var status = document.getElementById('filterOpnameStatus').value;
    callServerApi('GET_STOCK_OPNAME', { kategori: kat, status: status }, { silent: true })
      .then(function(res) {
        APP_STATE.stockOpnameList = res.data.records || [];
        APP_STATE.nextAutoNumberOpname = res.data.nextAutoNumber || 'SO-AUTO';
        saveFastStateCache();
        renderStockOpnameTable();
      });
  }

  function renderStockOpnameTable() {
    var q = (document.getElementById('filterOpnameSearch').value || '').trim().toLowerCase();
    var canApprove = APP_STATE.permissions.canApproveStockOpname;
    var tbody = document.getElementById('stockOpnameTableBody');

    var filtered = APP_STATE.stockOpnameList.filter(function(r) {
      if (!q) return true;
      var hay = (r.no_opname + ' ' + r.kode_barang + ' ' + r.nama_barang + ' ' + r.petugas_pemeriksa + ' ' + r.alasan_selisih).toLowerCase();
      return hay.indexOf(q) !== -1;
    });

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="12" class="text-center text-muted py-4">Belum ada catatan pemeriksaan Stock Opname.</td></tr>';
      return;
    }

    var html = '';
    for (var i = 0; i < filtered.length; i++) {
      var r = filtered[i];
      var selisihClass = r.selisih < 0 ? 'text-danger fw-bolder' : (r.selisih > 0 ? 'text-success fw-bolder' : 'text-muted');
      var selisihText = (r.selisih > 0 ? '+' : '') + formatNumber(r.selisih) + ' ' + r.satuan;

      var statusBadge = '<span class="badge-pmi badge-perhatian">PENDING</span>';
      if (r.status_persetujuan === 'APPROVED') {
        statusBadge = '<span class="badge-pmi badge-aman"><i class="bi bi-check2-all"></i> APPROVED</span><div class="small text-muted mt-1">' + escapeHtml(r.disetujui_oleh) + '</div>';
      } else if (r.status_persetujuan === 'REJECTED') {
        statusBadge = '<span class="badge-pmi badge-expired">REJECTED</span>';
      }

      var actionCol = '';
      if (r.status_persetujuan === 'PENDING' && canApprove) {
        actionCol =
          '<div class="btn-group btn-group-sm">' +
            '<button class="btn btn-success fw-bold" title="Setujui & Sesuaikan Stok" onclick="handleApproveOpname(\'' + r.id_opname + '\', \'APPROVED\')"><i class="bi bi-check-lg"></i> Setujui</button>' +
            '<button class="btn btn-outline-danger" title="Tolak Hasil Opname" onclick="handleApproveOpname(\'' + r.id_opname + '\', \'REJECTED\')"><i class="bi bi-x-lg"></i></button>' +
          '</div>';
      } else {
        actionCol = '<span class="small text-muted">' + (r.status_persetujuan === 'PENDING' ? 'Menunggu Admin' : 'Selesai') + '</span>';
      }

      html +=
        '<tr>' +
          '<td class="fw-bold">' + escapeHtml(r.no_opname) + '</td>' +
          '<td>' + escapeHtml(r.tanggal_periksa) + '</td>' +
          '<td><div class="fw-bold">' + escapeHtml(r.nama_barang) + '</div><div class="small text-danger fw-bold">' + escapeHtml(r.kode_barang) + '</div></td>' +
          '<td>' + renderCategoryBadge(r.kategori) + '</td>' +
          '<td class="text-end fw-bold">' + formatNumber(r.stok_sistem) + ' ' + escapeHtml(r.satuan) + '</td>' +
          '<td class="text-end fw-bolder bg-light">' + formatNumber(r.stok_fisik) + ' ' + escapeHtml(r.satuan) + '</td>' +
          '<td class="text-end ' + selisihClass + '">' + selisihText + '</td>' +
          '<td class="text-end">' + formatRupiah(r.nilai_selisih) + '</td>' +
          '<td>' + escapeHtml(r.alasan_selisih) + '</td>' +
          '<td>' + escapeHtml(r.petugas_pemeriksa) + '</td>' +
          '<td>' + statusBadge + '</td>' +
          '<td class="text-center">' + actionCol + '</td>' +
        '</tr>';
    }
    tbody.innerHTML = html;
  }

  function openStockOpnameWorksheetModal() {
    renderOpnameWorksheetRows();
    new bootstrap.Modal(document.getElementById('modalStockOpname')).show();
  }

  function renderOpnameWorksheetRows() {
    var kat = document.getElementById('soKategoriFilter').value || 'FOOD ITEMS';
    var items = APP_STATE.masterBarang.filter(function(it) {
      if (it.status_aktif !== 'AKTIF') return false;
      if (kat !== 'SEMUA' && it.kategori !== kat) return false;
      return true;
    });

    var tbody = document.getElementById('opnameWorksheetBody');
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      html +=
        '<tr data-id-barang="' + it.id_barang + '" data-stok-sistem="' + it.saldo_stok + '">' +
          '<td class="fw-bold text-danger">' + escapeHtml(it.kode_barang) + '</td>' +
          '<td class="fw-bold">' + escapeHtml(it.nama_barang) + '</td>' +
          '<td>' + renderCategoryBadge(it.kategori) + '</td>' +
          '<td>' + escapeHtml(it.satuan) + '</td>' +
          '<td class="text-end fw-bold">' + formatNumber(it.saldo_stok) + '</td>' +
          '<td>' +
            '<input type="number" class="form-control form-control-sm fw-bold opname-fisik-input" min="0" step="any" placeholder="Isi fisik..." oninput="updateWorksheetRowDiff(this)">' +
          '</td>' +
          '<td class="text-end fw-bold opname-selisih-cell">-</td>' +
          '<td>' +
            '<input type="text" class="form-control form-control-sm opname-alasan-input" placeholder="Catatan / alasan selisih...">' +
          '</td>' +
        '</tr>';
    }
    tbody.innerHTML = html || '<tr><td colspan="8" class="text-center text-muted py-3">Tidak ada barang pada kategori ini.</td></tr>';
  }

  function updateWorksheetRowDiff(inputEl) {
    var tr = inputEl.closest('tr');
    var stokSistem = parseFloat(tr.getAttribute('data-stok-sistem') || '0');
    var valStr = inputEl.value;
    var diffCell = tr.querySelector('.opname-selisih-cell');

    if (valStr === '' || valStr === null) {
      diffCell.textContent = '-';
      diffCell.className = 'text-end fw-bold opname-selisih-cell';
      return;
    }

    var fisik = parseFloat(valStr) || 0;
    var diff = fisik - stokSistem;
    diffCell.textContent = (diff > 0 ? '+' : '') + formatNumber(diff);
    diffCell.className = 'text-end fw-bolder opname-selisih-cell ' + (diff < 0 ? 'text-danger' : (diff > 0 ? 'text-success' : 'text-muted'));
  }

  function handleSaveStockOpnameWorksheet() {
    var rows = document.querySelectorAll('#opnameWorksheetBody tr[data-id-barang]');
    var itemsPayload = [];
    for (var i = 0; i < rows.length; i++) {
      var tr = rows[i];
      var fisikInput = tr.querySelector('.opname-fisik-input');
      var alasanInput = tr.querySelector('.opname-alasan-input');
      if (fisikInput && fisikInput.value !== '') {
        itemsPayload.push({
          id_barang: tr.getAttribute('data-id-barang'),
          stok_fisik: parseFloat(fisikInput.value),
          alasan_selisih: alasanInput ? alasanInput.value.trim() : ''
        });
      }
    }

    if (itemsPayload.length === 0) {
      showToast('Silakan isi jumlah fisik minimal pada 1 barang yang diperiksa.', 'warning');
      return;
    }

    var payload = {
      tanggal_jadwal: document.getElementById('soTanggalJadwal').value,
      tanggal_periksa: document.getElementById('soTanggalPeriksa').value,
      kategori_filter: document.getElementById('soKategoriFilter').value,
      petugas_pemeriksa: document.getElementById('soPetugasPemeriksa').value.trim(),
      items: itemsPayload
    };

    callServerApi('SAVE_STOCK_OPNAME', payload, { loadingTitle: 'Menyimpan Hasil Pemeriksaan Stock Opname...' })
      .then(function(res) {
        bootstrap.Modal.getInstance(document.getElementById('modalStockOpname')).hide();
        showToast(res.message, 'success');
        loadStockOpnameData();
      });
  }

  function handleApproveOpname(idOpname, decision) {
    var rec = APP_STATE.stockOpnameList.find(function(x) { return x.id_opname === idOpname; });
    if (!rec) return;

    var isApprove = decision === 'APPROVED';
    showCustomPopup({
      variant: isApprove ? 'success' : 'danger',
      icon: isApprove ? 'bi-clipboard2-check-fill' : 'bi-x-octagon-fill',
      title: isApprove ? 'Setujui Hasil Stock Opname?' : 'Tolak Hasil Stock Opname?',
      message: isApprove
        ? 'Saldo stok sistem akan otomatis disesuaikan mengikuti jumlah stok fisik hasil pemeriksaan.'
        : 'Hasil pemeriksaan fisik ini akan ditandai DITOLAK dan saldo stok sistem tidak akan berubah.',
      detailHtml:
        '<div class="fw-bolder text-dark mb-1">' + escapeHtml(rec.no_opname) + ' &bull; ' + escapeHtml(rec.nama_barang) + '</div>' +
        '<div class="d-flex justify-content-between small">' +
          '<span>Stok Sistem: <strong>' + formatNumber(rec.stok_sistem) + ' ' + escapeHtml(rec.satuan) + '</strong></span>' +
          '<span>Stok Fisik: <strong class="text-primary">' + formatNumber(rec.stok_fisik) + ' ' + escapeHtml(rec.satuan) + '</strong></span>' +
          '<span>Selisih: <strong class="' + (rec.selisih < 0 ? 'text-danger' : 'text-success') + '">' + (rec.selisih > 0 ? '+' : '') + formatNumber(rec.selisih) + '</strong></span>' +
        '</div>',
      cancelText: 'Batal',
      confirmText: isApprove ? 'Ya, Setujui & Sesuaikan' : 'Ya, Tolak Opname',
      confirmIcon: isApprove ? 'bi-check2-all' : 'bi-x-circle'
    }).then(function(confirmed) {
      if (!confirmed) return;
      callServerApi('APPROVE_STOCK_OPNAME', { id_opname: idOpname, decision: decision })
        .then(function(res) {
          showToast(res.message, 'success');
          loadMasterBarangData(true);
          loadStockOpnameData();
          loadDashboardData(true);
        });
    });
  }

  function setExpiredStatusFilter(statusVal) {
    document.getElementById('filterExpStatus').value = statusVal;

  function loadExpiredMonitoringData() {
    var payload = {
      search: document.getElementById('filterExpSearch').value.trim(),
      kategori: document.getElementById('filterExpKategori').value,
      status_expired: document.getElementById('filterExpStatus').value,
      startDate: document.getElementById('filterExpStartDate').value,
      endDate: document.getElementById('filterExpEndDate').value
    };

    callServerApi('GET_EXPIRED_MONITORING', payload, { silent: true })
      .then(function(res) {
        var sum = res.data.summary || {};
        APP_STATE.expiredSummary = sum;
        APP_STATE.expiredMonitoringList = res.data.items || [];
        saveFastStateCache();
        applyExpiredDataToDOM(sum, APP_STATE.expiredMonitoringList);
      });
  }

  function applyExpiredDataToDOM(sum, list) {
    var s = sum || {};
    var items = list || [];

    document.getElementById('expCountKedaluwarsa').textContent = formatNumber(s.kedaluwarsa || 0);
    document.getElementById('expCountSegera').textContent = formatNumber(s.segeraKedaluwarsa || 0);
    document.getElementById('expCountPerhatian').textContent = formatNumber(s.perhatian || 0);
    document.getElementById('expCountAman').textContent = formatNumber(s.aman || 0);

    var tbody = document.getElementById('expiredMonitoringTableBody');
    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4">Tidak ada barang dengan tanggal kedaluwarsa pada filter ini.</td></tr>';
      return;
    }

    var html = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var daysText = it.days_remaining <= 0
        ? '<span class="text-danger fw-bolder">Lewat ' + Math.abs(it.days_remaining) + ' hari</span>'
        : '<span class="fw-bold">' + it.days_remaining + ' hari lagi</span>';

      html +=
        '<tr>' +
          '<td class="fw-bold text-danger">' + escapeHtml(it.kode_barang) + '</td>' +
          '<td class="fw-bold">' + escapeHtml(it.nama_barang) + '</td>' +
          '<td>' + renderCategoryBadge(it.kategori) + '</td>' +
          '<td>' + escapeHtml(it.no_batch_dokumen) + '</td>' +
          '<td>' + escapeHtml(it.sumber_donor) + '</td>' +
          '<td class="text-end fw-bold">' + formatNumber(it.saldo_stok_saat_ini) + ' ' + escapeHtml(it.satuan) + '</td>' +
          '<td>' + escapeHtml(it.lokasi_rak) + '</td>' +
          '<td class="fw-bold">' + escapeHtml(it.expired_date) + '</td>' +
          '<td class="text-center">' + daysText + '</td>' +
          '<td>' + renderExpiryBadge(it.status_expired) + '</td>' +
        '</tr>';
    }
    tbody.innerHTML = html;
  }

  function generateSelectedReport() {
    var payload = {
      reportType: document.getElementById('reportTypeSelect').value,
      startDate: document.getElementById('reportStartDate').value,
      endDate: document.getElementById('reportEndDate').value,
      kategori: document.getElementById('reportKategoriSelect').value,

    };
